<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Agendar · NC Studio</title>

<style>
:root{--bg:#F2E4D2;--card:#FEFEFE;--fg:#222020;--muted:#5d5650;--line:#D9CDBE;--accent:#F99824;--soft:#FDF1E2;--err:#B42318}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--fg);font-size:16px}
.top{background:var(--fg);padding:14px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:14px}
.top img{height:36px;display:block}.top span{color:var(--bg);font-family:Georgia,serif;font-size:20px}
.top a{margin-left:auto;color:var(--bg);font-size:13px}
.bar{height:5px;background:var(--accent)}
main{max-width:760px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 120px;display:grid;gap:16px}
section{background:var(--card);border-radius:10px;padding:18px 18px 20px;display:grid;gap:12px}
h2{margin:0;font-family:Georgia,serif;font-weight:400;font-size:22px}
label{display:grid;gap:6px;font-size:14px;font-weight:bold}
label small{font-weight:normal;color:var(--muted)}
input,select,textarea{font:inherit;font-weight:normal;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--fg);width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
.inc{margin:0;padding:10px 12px 10px 30px;background:var(--soft);border-radius:6px;font-size:14px;line-height:1.6}
.ex{display:grid;grid-template-columns:1fr 100px 44px;gap:8px;align-items:center}
.x{border:1px solid var(--line);background:#fff;border-radius:6px;height:44px;font-size:20px;cursor:pointer;color:var(--fg)}
.btn{font:bold 16px Arial,sans-serif;border:0;border-radius:8px;padding:15px 22px;cursor:pointer;background:var(--accent);color:var(--fg)}
.btn2{font:bold 14px Arial,sans-serif;border:1px dashed var(--muted);background:transparent;border-radius:6px;padding:10px 14px;cursor:pointer;color:var(--fg);justify-self:start}
.radio{display:flex;gap:10px;align-items:flex-start;font-weight:normal;font-size:15px;grid-template-columns:none;padding:12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.radio input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.sum{display:grid;gap:6px;font-size:15px}.sum div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.sum .t{font-size:20px;font-weight:bold;border-top:1px solid var(--line);padding-top:8px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--fg);color:var(--bg);padding:12px max(16px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;justify-content:space-between}
.foot b{font-size:20px;font-variant-numeric:tabular-nums}.foot small{display:block;font-size:12px;opacity:.8}
.err{color:var(--err);font-size:14px;margin:0}
.msg{background:var(--card);border-radius:10px;padding:22px;line-height:1.6}.msg h2{margin-bottom:8px}
.spin{width:22px;height:22px;border:3px solid var(--bg);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.hint{font-size:13px;color:var(--muted);margin:0}
.tabs{display:flex;background:var(--fg);padding:0 max(16px,env(safe-area-inset-left));gap:4px}
.tabs button{flex:1;max-width:200px;font:bold 15px Arial,sans-serif;background:transparent;color:var(--bg);border:0;border-bottom:4px solid transparent;padding:12px 8px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-bottom-color:var(--accent);color:#fff}
.cl{display:grid;gap:4px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;font:inherit;color:var(--fg)}
.cl b{font-size:17px}.cl span{font-size:14px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:bold;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--fg);justify-self:start}
.chip.ok{background:#D1FADF}.chip.wait{background:#FEF0C7}.chip.no{background:#FEE4E2}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.acts{grid-template-columns:1fr}}
.act{font:bold 15px Arial,sans-serif;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 14px;cursor:pointer;color:var(--fg)}
.act[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#0b2e17;font:bold 17px Arial,sans-serif;text-decoration:none;border-radius:8px;padding:16px}
.back{background:none;border:0;font:bold 15px Arial,sans-serif;color:var(--fg);cursor:pointer;padding:4px 0;justify-self:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chk{display:flex;gap:8px;align-items:center;font-weight:normal;grid-template-columns:none}.chk input{width:20px;height:20px;accent-color:var(--accent)}
</style>
</head>

    $("bq").value = q || "";
    function pinta() {
      var t = $("bq").value.toLowerCase().trim();
      var hoy = new Date().toISOString().slice(0, 10);
      var L = LIST.filter(function (x) { return x.estado !== "No disponible" || t; }).filter(function (x) { return !t || (x.name + " " + x.phone + " " + x.id + " " + x.service).toLowerCase().indexOf(t) >= 0; });
      L.sort(function (a, b) { var fa = a.dateIso >= hoy, fb = b.dateIso >= hoy; if (fa !== fb) return fa ? -1 : 1; return fa ? (a.dateIso < b.dateIso ? -1 : 1) : (a.dateIso > b.dateIso ? -1 : 1); });
      $("ls").innerHTML = L.length ? "" : '<div class="msg">No hay clientes que coincidan.</div>';
      L.forEach(function (x) {
        var b = document.createElement("button"); b.className = "cl";
        b.innerHTML = chip(x.estado) + "<b>" + esc(x.name) + "</b><span>" + esc(x.service) + "</span><span>" + esc(x.fecha) + " · " + esc(x.phone) + "</span>";
        b.onclick = function () { detalle(x); }; $("ls").appendChild(b);
      });
    }
    $("bq").oninput = pinta; $("rf").onclick = function () { clientes(); }; pinta();
  }
  function msgs(x) {
    var n = first(x.name), ev = x.kind === "evento", firma = "\n\n— Nelson y Charlie · NC Studio";
    function acc(g) { return g ? "\n\n🔗 " + g.link + (g.clave ? "\n🔑 Contraseña: " + g.clave : "") + (g.pin ? "\n📥 PIN de descarga: " + g.pin : "") : ""; }
    return {
      cot: "¡Hola, " + n + "! 💛 Muchas gracias por tu preferencia. ¡Tenemos disponible tu fecha: " + x.fecha + "! 🙌🏼\n\nTu cotización de *" + x.service + "*:\n• Total: " + x.total + "\n• Abono para reservar (50 %): *" + x.abono + "*\n• Saldo el día de la " + (ev ? "cobertura" : "sesión") + ": " + x.saldo +
        "\n\nPara bloquear tu fecha, envía el abono por *Yappy al " + YAPPY + "* en un plazo máximo de 48 horas y mándanos la captura por aquí. 📲\n\nTambién te enviamos la cotización en PDF a tu correo (" + x.email + "). ¡Cualquier duda, quedamos a la orden!" + firma,
      con: "¡Hola, " + n + "! 💛 Ya recibimos tu abono de " + x.abono + ". ¡Tu fecha está oficialmente reservada! 🙌🏼\n\nSolo falta un paso: lee y firma tu contrato en línea aquí 👇\n" + x.contrato + "\n\nMarca la casilla «Acepto» y presiona «Enviar confirmación». Te llegará una copia en PDF a tu correo.\n\n¡Gracias por confiar en nosotros! ✨" + firma,
      rec: "¡Hola, " + n + "! ✨ ¡Ya casi llega el gran día!\n\n📅 " + x.fecha + "\n📍 " + x.place + "\n📸 " + x.service + "\n💵 Saldo a pagar ese día: " + x.saldo + "\n\nPara que todo salga increíble:\n" +
        (ev ? "• Cuéntanos los momentos clave que no nos podemos perder (brindis, pastel, entradas).\n• Compártenos la hora exacta y la dirección del lugar.\n" : "• Prepara tus looks y accesorios con tiempo; déjalos listos la noche anterior.\n• Descansa bien y mantente hidratada.\n") +
        "• Llega puntual para aprovechar al máximo la luz y el tiempo.\n\n" + (ev ? "Tus fotos editadas te llegan en tu galería en línea 10 días después del evento." : "Las pruebas te llegan de 48 a 72 horas hábiles después de la sesión.") + " ¿Nos confirmas que recibiste este mensaje? 💛" + firma,
      pru: "¡Hola, " + n + "! 📸 ¡Tus fotos de prueba ya están listas!" + acc(x.gp) +
        "\n\n*Cómo elegir tus fotos:*\n1. Entra al link y toca el corazón ♡ en tus favoritas (la primera vez te pide tu correo).\n2. Revisa tu selección en «Favorites», arriba a la derecha.\n3. Puedes elegir *" + (x.photos || "las") + " fotos* incluidas en tu paquete. Fotos extra: $10 c/u. Liberación de galería (todas sin editar): $60.\n4. Cuando termines, escríbenos por aquí: «Ya elegí mis fotos» ✅\n\nTus fotos finales te llegan en máximo 2 semanas después de recibir tu selección. 💛" + firma,
      fin: "¡Hola, " + n + "! 🎁 ¡Llegaron tus fotos finales!" + acc(x.gf) +
        "\n\nPuedes descargarlas y compartirlas con quien quieras. Gracias por permitirnos vivir esta experiencia contigo; esperamos volver a verte pronto frente a la cámara. 💛\n\nSi te gustó, nos ayudaría muchísimo que nos dejes un testimonio cortito. ¡Gracias! ✨" + firma
    };
  }
  function detalle(x, cual) {
    tab("C");
    var acts = [["si", "✅ Sí hay disponibilidad", x.estado === "Pendiente"],
      ["cot", "💬 Cotización y abono", x.estado !== "No disponible"],
      ["pago", "💰 Marcar abono recibido", x.estado === "Cotización enviada"],
      ["con", x.firmado ? "✍️ Contrato (ya firmado)" : "✍️ Contrato para firmar", !!x.contrato],
      ["rec", "⏰ Recordatorio", x.estado === "Confirmado"],
      ["pru", "📷 Fotos de prueba", x.kind !== "evento" && x.estado === "Confirmado"],
      ["fin", "🎁 Fotos finales", x.estado === "Confirmado"]].filter(function (a) { return a[2]; });
    app.innerHTML = '<button class="back" id="bk">‹ Todos los clientes</button><section>' + chip(x.estado) + '<h2>' + esc(x.name) + '</h2>' +
      '<p class="hint" style="font-size:15px;line-height:1.6">' + esc(x.id) + " · " + esc(x.service) + "<br>" + esc(x.fecha) + " · " + esc(x.place) + "<br>📱 " + esc(x.phone) + " · ✉️ " + esc(x.email) + "<br>Total " + esc(x.total) + " · abono " + esc(x.abono) + (x.contrato ? (x.firmado ? " · ✅ contrato firmado" : " · contrato pendiente de firma") : "") + '</p>' +
      '<div class="acts">' + acts.map(function (a) { return '<button class="act" data-k="' + a[0] + '" aria-pressed="' + (a[0] === cual) + '">' + a[1] + '</button>'; }).join("") + '</div></section><div id="cmp"></div>';
    $("bk").onclick = function () { lista(""); };
    Array.prototype.forEach.call(app.querySelectorAll(".act"), function (b) { b.onclick = function () { detalle(x, b.getAttribute("data-k")); }; });
    if (cual) componer(x, cual);
  }
  function componer(x, k) {
    var box = $("cmp");
    if (k === "pago" || k === "si") {
      var pg = k === "pago", lb = pg ? "Sí, abono recibido" : "Sí, enviar cotización";
      box.innerHTML = pg
        ? '<section><h2>¿Ya llegó el abono?</h2><p>Marca el abono de <b>' + esc(x.abono) + '</b> de ' + esc(x.name) + ' como recibido. Le llegará por correo la confirmación con el enlace del contrato, y después podrás mandárselo también por WhatsApp.</p><button class="btn" id="okp">' + lb + '</button><p class="err" id="perr2"></p></section>'
        : '<section><h2>¿Tienes disponible esa fecha?</h2><p>' + esc(x.fecha) + '. Le enviamos a ' + esc(x.name) + ' la cotización en PDF por correo y separamos la fecha en tu calendario. Después puedes mandarle el resumen por WhatsApp.</p><button class="btn" id="okp">' + lb + '</button><p class="err" id="perr2"></p></section>';
      $("okp").onclick = function () {
        $("okp").disabled = true; $("okp").innerHTML = '<span class="spin"></span>Enviando…';
        call({ action: k, id: x.id, t: x.t }).then(function (r) {
          if (!r.ok) { $("perr2").innerHTML = esc(r.title) + ". " + (r.html || ""); $("okp").disabled = false; $("okp").textContent = lb; return; }
          call({ action: "clientes", pin: PIN }).then(function (r2) { LIST = r2.list || LIST; var y = LIST.filter(function (z) { return z.id === x.id; })[0] || x; detalle(y, pg ? "con" : "cot"); });
        }).catch(function () { $("perr2").textContent = "No pudimos conectar."; $("okp").disabled = false; $("okp").textContent = lb; });
      };
      box.scrollIntoView({ block: "start", behavior: "smooth" }); return;
    }
    var gkey = k === "pru" ? "gp" : k === "fin" ? "gf" : "";
    if (gkey && !x[gkey]) { galForm(x, k, gkey); return; }
    var txt = msgs(x)[k];
    box.innerHTML = '<section><h2>Mensaje</h2>' + (gkey ? '<button class="btn2" id="cg">Cambiar link de la galería</button>' : "") +
      '<label for="mt">Puedes editarlo antes de enviar<textarea id="mt" style="min-height:300px"></textarea></label>' +
      '<a class="wa" id="wa" target="_blank" rel="noopener">Abrir en WhatsApp</a><div class="row"><button class="btn2" id="cp">Copiar mensaje</button><span class="hint" id="cps"></span></div>' +
      '<p class="hint">Se abre el chat de ' + esc(x.name) + ' (' + esc(x.phone) + ') con el mensaje escrito. Solo presiona enviar ➤ en WhatsApp.</p></section>';
    var mt = $("mt"); mt.value = txt;
    function link() { $("wa").href = "https://wa.me/" + wnum(x.phone) + "?text=" + encodeURIComponent(mt.value); }
    mt.oninput = link; link();
    $("cp").onclick = function () { var ok = function () { $("cps").textContent = "✓ Copiado"; }; if (navigator.clipboard) navigator.clipboard.writeText(mt.value).then(ok, function () { mt.select(); }); else { mt.select(); document.execCommand("copy"); ok(); } };
    if ($("cg")) $("cg").onclick = function () { galForm(x, k, gkey); };
    box.scrollIntoView({ block: "start", behavior: "smooth" });
  }
  function galForm(x, k, gkey) {
    var g = x[gkey] || {}, pr = k === "pru";
    $("cmp").innerHTML = '<section><h2>' + (pr ? "Galería de pruebas" : "Galería final") + '</h2><p class="hint">Pega los datos de la galería de Pixieset. Se guardan para este cliente.</p>' +
      '<label for="gl">Link de la galería<input id="gl" type="url" placeholder="https://…" autocomplete="off"></label><div class="g2"><label for="gc">Contraseña <small>(opcional)</small><input id="gc" autocomplete="off"></label><label for="gn">PIN de descarga <small>(opcional)</small><input id="gn" autocomplete="off"></label></div>' +
      '<label class="chk"><input type="checkbox" id="gm" checked> Enviarle también el correo con las instrucciones</label><button class="btn" id="gok">Guardar y preparar mensaje</button><p class="err" id="gerr"></p></section>';
    $("gl").value = g.link || ""; $("gc").value = g.clave || ""; $("gn").value = g.pin || "";
    $("gok").onclick = function () {
      var lk = $("gl").value.trim();
      if (!/^https?:\/\//i.test(lk)) { $("gerr").textContent = "Pega el link completo (empieza con https://)."; return; }
      $("gok").disabled = true; $("gok").innerHTML = '<span class="spin"></span>Guardando…';
      var body = { action: pr ? "pruebas" : "final", id: x.id, t: x.t, link: lk, clave: $("gc").value.trim(), pin: $("gn").value.trim(), correo: $("gm").checked };
      call(body).then(function (r) {
        if (!r.ok) { $("gerr").innerHTML = esc(r.title) + ". " + (r.html || ""); $("gok").disabled = false; $("gok").textContent = "Guardar y preparar mensaje"; return; }
        x[gkey] = { link: body.link, clave: body.clave, pin: body.pin }; componer(x, k);
      }).catch(function () { $("gerr").textContent = "No pudimos conectar."; $("gok").disabled = false; $("gok").textContent = "Guardar y preparar mensaje"; });
    };
    $("cmp").scrollIntoView({ block: "start", behavior: "smooth" });
  }
  salir.onclick = function (e) { e.preventDefault(); setPin(""); PIN = ""; pinView(); };
  if (PIN) form(); else pinView();
})();
</script>
</body>
</html>
