<style>

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--fg);font-size:16px}
.top{background:var(--fg);padding:14px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:14px}
.top img{height:36px;display:block}.top span{color:var(--bg);font-family:Georgia,serif;font-size:20px}
.top a{margin-left:auto;color:var(--bg);font-size:13px}
.bar{height:5px;background:var(--accent)}
main{max-width:760px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 120px;display:grid;gap:16px}
section{background:var(--card);border-radius:10px;padding:18px 18px 20px;display:grid;gap:12px}
h2{margin:0;font-family:Georgia,serif;font-weight:400;font-size:22px}
label{display:grid;gap:6px;font-size:14px;font-weight:bold}
label small{font-weight:normal;color:var(--muted)}
input,select,textarea{font:inherit;font-weight:normal;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--fg);width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

.inc{margin:0;padding:10px 12px 10px 30px;background:var(--soft);border-radius:6px;font-size:14px;line-height:1.6}
.ex{display:grid;grid-template-columns:1fr 100px 44px;gap:8px;align-items:center}
.x{border:1px solid var(--line);background:#fff;border-radius:6px;height:44px;font-size:20px;cursor:pointer;color:var(--fg)}
.btn{font:bold 16px Arial,sans-serif;border:0;border-radius:8px;padding:15px 22px;cursor:pointer;background:var(--accent);color:var(--fg)}
.btn2{font:bold 14px Arial,sans-serif;border:1px dashed var(--muted);background:transparent;border-radius:6px;padding:10px 14px;cursor:pointer;color:var(--fg);justify-self:start}
.radio{display:flex;gap:10px;align-items:flex-start;font-weight:normal;font-size:15px;grid-template-columns:none;padding:12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.radio input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.sum{display:grid;gap:6px;font-size:15px}.sum div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.sum .t{font-size:20px;font-weight:bold;border-top:1px solid var(--line);padding-top:8px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--fg);color:var(--bg);padding:12px max(16px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;justify-content:space-between}
.foot b{font-size:20px;font-variant-numeric:tabular-nums}.foot small{display:block;font-size:12px;opacity:.8}
.err{color:var(--err);font-size:14px;margin:0}
.msg{background:var(--card);border-radius:10px;padding:22px;line-height:1.6}.msg h2{margin-bottom:8px}
.spin{width:22px;height:22px;border:3px solid var(--bg);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.hint{font-size:13px;color:var(--muted);margin:0}
.tabs{display:flex;background:var(--fg);padding:0 max(16px,env(safe-area-inset-left));gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;max-width:200px;white-space:nowrap;font:bold 15px Arial,sans-serif;background:transparent;color:var(--bg);border:0;border-bottom:4px solid transparent;padding:12px 8px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-bottom-color:var(--accent);color:#fff}
@media (max-width:480px){.tabs{gap:0;padding:0 8px}.tabs button{font-size:13px;padding:12px 6px}}
.cl{display:grid;gap:4px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;font:inherit;color:var(--fg)}
.cl b{font-size:17px}.cl span{font-size:14px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:bold;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--fg);justify-self:start}
.chip.ok{background:#D1FADF}.chip.wait{background:#FEF0C7}.chip.no{background:#FEE4E2}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.acts{grid-template-columns:1fr}}
.act{font:bold 15px Arial,sans-serif;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 14px;cursor:pointer;color:var(--fg)}
.act[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#0b2e17;font:bold 17px Arial,sans-serif;text-decoration:none;border-radius:8px;padding:16px}
.back{background:none;border:0;font:bold 15px Arial,sans-serif;color:var(--fg);cursor:pointer;padding:4px 0;justify-self:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--soft);border-radius:8px;padding:12px 14px;display:grid;gap:2px}.kpi b{font-size:20px;font-variant-numeric:tabular-nums}.kpi span{font-size:13px;color:var(--muted)}
.mv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.mv .m{font-weight:bold;font-variant-numeric:tabular-nums;text-align:right}.mv .m.in{color:#067647}.mv small{color:var(--muted);font-size:13px;grid-column:1/-1}
.mv .ac{grid-column:1/-1;display:flex;gap:8px}.mv .ac button{font:bold 13px Arial,sans-serif;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--fg)}
.card2{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:#fff}
.card2 .top2{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}.card2 .top2 b{font-size:18px;font-variant-numeric:tabular-nums}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media (max-width:560px){.g3{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{font:bold 14px Arial,sans-serif;border:1.5px solid var(--fg);background:transparent;color:var(--fg);border-radius:999px;padding:9px 16px;cursor:pointer}.seg button[aria-pressed="true"]{background:var(--fg);color:#fff}
.tb{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}.tb td,.tb th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.tb td:first-child,.tb th:first-child{text-align:left;white-space:normal}.tb th{font-size:12px;color:var(--muted)}.tb tr.tot td{font-weight:bold;background:var(--soft)}
.bar{height:8px;border-radius:4px;background:var(--accent)}.neg{color:var(--err)}.pos{color:#067647}
.scx{overflow-x:auto;margin:0 -4px;padding:0 4px}
.xg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.xc{display:grid;grid-template-rows:auto 1fr;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;cursor:pointer;font:inherit;color:var(--fg)}
.xc img,.xc .xall{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 30%;display:block;background:var(--fg)}
.xc .xall{display:flex;align-items:center;justify-content:center;color:var(--accent);font:400 34px Georgia,serif}
.xc span{display:grid;gap:2px;padding:10px 12px 12px}.xc b{font-size:15px}.xc small{font-size:12px;color:var(--muted)}
.ig{font:bold 17px Arial,sans-serif;border:0;border-radius:8px;padding:16px;cursor:pointer;color:#fff;background:linear-gradient(45deg,#C13584,#E1306C,#F77737)}
.fes{display:grid;gap:10px}
.cl{position:relative}.cl.cav{padding-right:72px}
.avi{width:46px;height:46px;border-radius:50%;object-fit:cover;object-position:center 30%;border:2px solid var(--accent);flex:none;display:block;background:var(--soft)}
.cl .avi{position:absolute;right:14px;top:50%;transform:translateY(-50%)}.avi.big{width:60px;height:60px}.pfh .avi{width:62px;height:62px}
.prg{display:grid;gap:4px}.prg .pb{height:10px;border-radius:5px;background:var(--line);overflow:hidden}.prg .pb i{display:block;height:100%;background:var(--accent)}
.stp{display:flex;gap:10px;align-items:center;padding:7px 2px;border-bottom:1px solid var(--line);font-size:15px}.stp:last-child{border-bottom:0}.stp .o{width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px}.stp.ok .o{background:#12B76A;border-color:#12B76A;color:#fff}.stp small{color:var(--muted);font-size:12px;margin-left:auto}.stp input{width:22px;height:22px;accent-color:#12B76A;flex:none;margin:0}.stp.ok span{color:var(--muted)}
.pfh{background:var(--fg);color:#FEFEFE;border-radius:14px;padding:20px;display:grid;gap:14px}
.pfh .who{display:flex;gap:14px;align-items:center}.pfh .av{width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--fg);display:flex;align-items:center;justify-content:center;font:400 26px Georgia,serif;flex:none}
.pfh h2{color:#FEFEFE;margin:0;font-size:24px}.pfh .sub{color:#F2E4D2;font-size:13px;margin-top:3px}
.pfc{display:flex;flex-wrap:wrap;gap:6px}.pfc a,.pfc span{background:rgba(255,255,255,.1);color:#FEFEFE;border-radius:20px;padding:6px 11px;font-size:13px;text-decoration:none}
.pfk{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pfk div{background:rgba(255,255,255,.08);border-radius:10px;padding:10px;text-align:center}.pfk b{display:block;font:400 20px Georgia,serif;color:var(--accent)}.pfk small{font-size:11px;color:#F2E4D2}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px;align-content:start}.tile span{font-size:12px;color:var(--muted)}.tile p{margin:0;font-size:15px;line-height:1.4}
.ses{background:#fff;border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:14px;display:grid;gap:8px}.ses.gris{border-left-color:var(--line)}

.fe{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;font:inherit;color:var(--fg);width:100%}

.pfv{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}.pfv img,.pfv .xall{display:block;width:100%;height:100%;object-fit:cover}

.phe{position:absolute;left:4px;top:4px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(34,32,32,.55);color:#fff;font-size:18px;cursor:pointer;line-height:1}.phe.on{background:#fff;color:#E0245E}
.pst{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(34,32,32,.55);color:#fff;font-size:15px;cursor:pointer;line-height:1}.pst.on{background:var(--accent);color:var(--fg)}
.chk{display:flex;gap:8px;align-items:center;font-weight:normal;grid-template-columns:none}.chk input{width:20px;height:20px;accent-color:var(--accent)}
</style>
</head>

        if (!r.ok) { $("rerr").textContent = r.title; return; }
        x.meet = { fecha: f, hora: h, link: lk };
        $("rbox").innerHTML = '<p class="pos" style="margin:0"><b>✓ Guardada' + (r.agendado ? " y anotada en tu calendario" : "") + '.</b></p><div id="rbox2" style="display:grid;gap:12px"></div>';
        panelMsg("rbox2", function () { return x; }, "¡Hola, " + first(x.name) + "! 💡 Te espero en nuestra *reunión creativa* para planificar tu sesión" + (x.base ? "" : " de " + x.service.split(" · ")[0]) + ".\n\n📅 " + r.fechaTxt + "\n⏰ " + h12(h) + "\n💻 Entra aquí: " + lk + "\n\nSi tienes fotos o ideas que te gusten, tenlas a mano ✨ ¡Nos vemos!", "Nuestra reunión creativa · NC Studio");
      }).catch(function () { b.disabled = false; b.textContent = "Guardar y preparar mensaje"; $("rerr").textContent = "No pudimos conectar."; });
    };
  }
  // lista de clientes (reservas) con buscador para elegir uno
  function persona(n, t) { var d = String(t || "").replace(/\D/g, ""); return d.length >= 7 ? d.slice(-8) + "|" + (normN(n).split(" ")[0] || "") : ""; }
  // clientes de tu base que no tienen reserva (para poder mandarles cosas igual)
  function soloBase() {
    var con = {}; (LIST || []).forEach(function (x) { con[persona(x.name, x.phone)] = 1; });
    return (BASE || []).filter(function (c) { return !con[persona(c.name, c.phone)]; }).map(function (c) { return { base: true, cid: c.id, id: "", name: c.name, phone: c.phone, email: c.email || "", instagram: c.instagram || "", service: "Sesión", fecha: "", estado: "Sin reserva", kind: "", ids: c.ids || [] }; });
  }
  function pickRes(boxId, filtro, alElegir, conBase) {
    var box = $(boxId);
    if (conBase && !BASE) { box.innerHTML = '<div class="msg"><span class="spin"></span>Cargando clientes…</div>'; cargaBase(function () { pickRes(boxId, filtro, alElegir, conBase); }); return; }
    function pinta() {
      var L = (LIST || []).filter(filtro).concat(conBase ? soloBase() : []);
      box.innerHTML = '<section><label for="pkq">Buscar cliente<input id="pkq" placeholder="Nombre, teléfono o NC-…" autocomplete="off"></label><div id="pkl" style="display:grid;gap:8px"></div></section>';
      function lst() {
        var t = $("pkq").value.toLowerCase().trim();
        var M = L.filter(function (x) { return !t || (x.name + " " + x.phone + " " + x.id + " " + x.service).toLowerCase().indexOf(t) >= 0; }).slice(0, 40);
        $("pkl").innerHTML = M.length ? "" : '<p class="hint">No hay clientes que coincidan.</p>';
        M.forEach(function (x) { var b = document.createElement("button"); b.className = "cl"; b.innerHTML = (x.base ? '<span class="chip">Contacto sin reserva</span>' : chip(x.estado)) + "<b>" + esc(x.name) + "</b><span>" + esc(x.base ? "📱 " + x.phone : x.service) + "</span>" + (x.fecha ? "<span>" + esc(x.fecha) + "</span>" : "") + avTag(x.name, x.phone, x.id || x.ids); b.onclick = function () { alElegir(x); }; $("pkl").appendChild(b); });
      }
      $("pkq").oninput = lst; lst();
    }
    if (LIST) { pinta(); return; }
    box.innerHTML = '<div class="msg"><span class="spin"></span>Cargando clientes…</div>';
    call({ action: "clientes", pin: PIN }).then(function (r) { LIST = r.list || []; YAPPY = r.yappy || YAPPY; pinta(); }).catch(function () { box.innerHTML = '<div class="msg">No pudimos conectar.</div>'; });
  }
  var NUEVO_CONTRATO = false;
  function contratoDe(x) {
    tab("E"); EV2 = "contrato";
    app.innerHTML = '<button class="back" id="ebk">‹ Elegir otro cliente</button><section><h2>Contrato de ' + esc(x.name) + '</h2><p class="hint">' + esc(x.id + " · " + x.service + " · " + x.fecha + " · total " + x.total) + (x.firmado ? '<br><b class="pos">✓ Ya firmó su contrato.</b>' : '') + '</p>' +
      '<div class="acts"><button class="act" id="cpdf">📄 Generar el PDF</button><button class="act" id="cmail">✉️ Enviárselo por correo</button></div><div id="cres"></div></section>';
    bindEnv(); $("ebk").onclick = function () { enviar("contrato"); };
    function gen(mail) {
      var b = $(mail ? "cmail" : "cpdf"), lb = b.textContent; b.disabled = true; b.innerHTML = '<span class="spin"></span>' + (mail ? "Enviando…" : "Generando…");
      call({ action: "contrato_pdf", pin: PIN, id: x.id, enviar: !!mail }).then(function (r) {
        b.disabled = false; b.textContent = lb;
        if (!r.ok) { $("cres").innerHTML = '<p class="err">' + esc(r.title) + '</p>'; return; }
        var txt = "¡Hola, " + first(x.name) + "! ✍️ Te comparto tu contrato de *" + x.service + "* (" + x.fecha + ").\n\n" + (r.firmado ? "Aquí tienes tu copia firmada 👇\n" + r.url : "Léelo y fírmalo aquí: marca «Acepto» y presiona «Enviar confirmación» 👇\n" + r.link + "\n\nSi prefieres verlo en PDF: " + r.url) + "\n\n¡Cualquier duda, quedamos a la orden! — Nelson y Charlie · NC Studio";
        $("cres").innerHTML = '<div class="card2"><b class="pos">✓ ' + esc(r.title) + (mail ? " a " + esc(x.email) : "") + '</b><a class="btn2" href="' + esc(r.url) + '" target="_blank" rel="noopener" style="text-decoration:none">Abrir el PDF ↗</a>' +
          '<label for="cmt">Mensaje para WhatsApp<textarea id="cmt" style="min-height:180px"></textarea></label><a class="wa" id="cwa" target="_blank" rel="noopener">Enviar por WhatsApp a ' + esc(first(x.name)) + '</a>' + extraHtml("k", true) + '</div>';
        $("cmt").value = txt; cargaBase(function () {}); extraBind("k", function () { return $("cmt").value; }, function () { return deBase(x.phone, "instagram"); }, function () { return ""; }, ""); var up = function () { $("cwa").href = "https://wa.me/" + wnum(x.phone) + "?text=" + encodeURIComponent($("cmt").value); }; $("cmt").oninput = up; up();
      }).catch(function () { b.disabled = false; b.textContent = lb; $("cres").innerHTML = '<p class="err">No pudimos conectar.</p>'; });
    }
    $("cpdf").onclick = function () { gen(false); }; $("cmail").onclick = function () { gen(true); };
  }

  /* mensajes para distintas ocasiones (cortos: caben en Instagram) */
  var OCASIONES = [
    ["primer", "👋 Primer contacto", "¡Hola, {nombre}! 💛 Soy Nelson de NC Studio. ¡Qué alegría que quieras hacer tus fotos con nosotros! ✨\n\nAquí ves todas nuestras experiencias, con precios y lo que incluye cada una 👇\n{pagina}\n\nTenemos fechas desde el *{libre}*. ¿Te ayudo a elegir? 😊"],
    ["seguimiento", "🔁 Seguimiento", "Hola, {nombre} 💛 ¿Pudiste ver la información que te envié? Si tienes alguna duda o quieres adaptar algo del paquete, con gusto te ayudo. También podemos hacer una llamada de 15 minutos. ¡Espero tenerte pronto frente a nuestro lente! 📸"],
    ["reservar", "🗓️ Cómo reservar", "¡Qué emoción, {nombre}! 🙌🏼 Así reservas tu fecha:\n\n1️⃣ Eliges tu experiencia y tu fecha en la página 👇\n{pagina}\n2️⃣ Te llega la cotización a tu correo.\n3️⃣ Abonas el 50 % por *Yappy al {yappy}* para bloquear la fecha.\n4️⃣ Firmas tu contrato en línea.\n\nEl otro 50 % se paga el día de la sesión. ¡Cualquier duda, aquí estoy! 💛"],
    ["abono_pend", "⏳ Abono pendiente", "Hola, {nombre} 💛 Te escribo para recordarte que tu fecha del *{fecha}* aún no está bloqueada: falta el abono de *{abono}* por Yappy al {yappy}. Como tenemos pocas fechas disponibles, solo podemos guardarla unos días más. ¿Te ayudo con algo? 😊"],
    ["liberar", "🔓 Liberar la fecha", "Hola, {nombre}. Como no recibimos el abono, liberamos la fecha del {fecha} para otras personas. Si más adelante quieres reservar, con gusto revisamos la disponibilidad. ¡Gracias por pensar en nosotros! 💛"],
    ["bienvenida", "✅ Abono recibido", "¡{nombre}, ya recibimos tu abono! 🙌🏼 Tu fecha del *{fecha}* está oficialmente reservada para tu *{servicio}*. Desde ya empezamos a planificar todo. Te escribimos pronto con los detalles. ¡Gracias por confiar en NC Studio! 💛"],
    ["recordatorio", "⏰ Recordatorio de la sesión", "¡Hola, {nombre}! ✨ ¡Ya casi llega el día!\n\n📅 {fecha}\n📸 {servicio}\n💵 Saldo ese día: {saldo}\n\nDeja tus looks listos desde la noche anterior, descansa bien y llega puntual para aprovechar la luz. ¿Nos confirmas que recibiste este mensaje? 😊"],
    ["saldo", "💵 Saldo pendiente", "Hola, {nombre} 💛 Te recuerdo que queda pendiente el saldo de *{saldo}* de tu {servicio}. Puedes enviarlo por *Yappy al {yappy}* y mandarnos la captura por aquí. ¡Gracias! 🙌🏼"],
    ["elegir", "♡ Recordar elegir fotos", "¡Hola, {nombre}! 📸 Te recuerdo elegir tus fotos favoritas en tu galería (toca el corazón ♡ en cada una). Cuando termines, avísanos por aquí y empezamos a editarlas. ¡Ya queremos que veas el resultado! ✨"],
    ["gracias", "💛 Gracias por la sesión", "¡{nombre}, gracias por una sesión tan bonita! 💛 Fue un placer acompañarte. Muy pronto te llegan tus fotos de prueba para que elijas tus favoritas. ✨"],
    ["testimonio", "⭐ Pedir testimonio", "¡Hola, {nombre}! 💛 Esperamos que estés disfrutando tus fotos. Nos ayudaría muchísimo que nos cuentes en un par de líneas cómo te sentiste con la experiencia; así más personas se animan a vivirla. ¡Gracias de corazón! ✨"],
    ["reagendar", "🌧️ Reagendar", "Hola, {nombre} 💛 Por el clima (o un imprevisto) te proponemos mover tu sesión del {fecha}. Tenemos disponible desde el *{libre}*. Dinos qué día te queda mejor y lo dejamos listo; tu abono queda guardado para la nueva fecha. 🙌🏼"],
    ["no_disp", "🚫 Fecha no disponible", "¡Hola, {nombre}! Gracias por escribirnos 💛 Lamentablemente ya tenemos ocupada esa fecha, pero tenemos disponible desde el *{libre}*. ¿Te gustaría alguna de esas? Puedes ver los días libres aquí 👇\n{pagina}"],
    ["cumple", "🎂 Feliz cumpleaños", "¡Feliz cumpleaños, {nombre}! 🎂✨ Que este nuevo año venga lleno de momentos que valga la pena recordar. Si quieres celebrarlo con una sesión Level Up, te esperamos 😉 — Nelson y Charlie · NC Studio"],
    ["promo", "🎄 Promoción o temporada", "¡Hola, {nombre}! ✨ Abrimos fechas especiales de temporada en NC Studio. Si quieres tus fotos para regalar o para recordar este momento, reserva tu espacio aquí 👇\n{pagina}\n\nTenemos fechas desde el *{libre}*. ¡Los espacios vuelan! 📸"]
  ];
  var MSGS_CLI = null;
  function rellenar(t, x) {
    var v = { nombre: x ? first(x.name) : "", fecha: x ? x.fecha : "tu fecha", servicio: x ? x.service : "tu sesión", saldo: x ? x.saldo : "", abono: x ? x.abono : "", yappy: YAPPY, pagina: SITE, libre: LIBRE || "próximas semanas" };
    t = t.replace(/\{(\w+)\}/g, function (m, k) { return v[k] !== undefined ? v[k] : m; });
    if (!x) t = t.replace(/, (!|\s💛)/, "$1").replace(/¡Hola, ! /, "¡Hola! ").replace(/Hola,  /, "Hola ").replace(/¡,? ?/, "¡");
    return t.replace(/¡Hola, !/g, "¡Hola!").replace(/Hola, 💛/g, "Hola 💛").replace(/¡ ya/g, "¡Ya");
  }
  function msgLista() { return (LIST || []).filter(function (x) { return x.estado !== "No disponible"; }).concat(BASE ? soloBase() : []); }
  function mensajes(oc) {
    tab("E"); EV2 = "msg";
    if (!oc) {
      app.innerHTML = segEnv("msg") + '<section><h2>Mensajes para cada ocasión</h2><p class="hint">Elige uno: te lo preparo con los datos del cliente, cortito para que quepa en Instagram.</p><div class="acts">' + OCASIONES.map(function (o, i) { return '<button class="act" data-oc="' + i + '">' + o[1] + '</button>'; }).join("") + '</div></section>';
      bindEnv();
      Array.prototype.forEach.call(app.querySelectorAll("[data-oc]"), function (b) { b.onclick = function () { primeraLibre(function () { mensajes(OCASIONES[+b.getAttribute("data-oc")]); }); }; });
      return;
    }
    app.innerHTML = '<button class="back" id="mbk">‹ Todos los mensajes</button><section><h2>' + esc(oc[1]) + '</h2>' +
      '<label for="mcs">Cliente <small>(opcional: llena nombre, fecha y montos)</small><select id="mcs"><option value="">— Sin cliente / escribirle a alguien nuevo —</option></select></label>' +
      '<div class="g2"><label for="mph">WhatsApp <small>(vacío = eliges el chat)</small><input id="mph" inputmode="tel" autocomplete="off"></label><label for="mig">Instagram <small>(sin @, opcional)</small><input id="mig" autocomplete="off"></label></div><label for="mem">Correo <small>(opcional)</small><input id="mem" type="email" autocomplete="off"></label>' +
      '<label for="mm">Puedes editarlo antes de enviar<textarea id="mm" style="min-height:220px"></textarea></label><p class="hint" id="mlen" style="text-align:right;margin-top:-6px"></p>' +
      '<a class="wa" id="mwa" target="_blank" rel="noopener">Enviar por WhatsApp</a>' + extraHtml("mx") +
      '<div class="row"><button class="btn2" id="mcp">Copiar mensaje</button><span class="hint" id="mcs2"></span></div></section>';
    bindEnv(); $("mbk").onclick = function () { mensajes(); };
    var m = $("mm"), sel = null;
    var upx = extraBind("mx", function () { return m.value; }, function () { return $("mig").value; }, function () { return $("mem").value; }, (oc[1].replace(/^\S+\s/, "")) + " · NC Studio");
    $("mem").oninput = function () { upx(); };
    function upd() { upx();
      var n = String($("mph").value || "").replace(/\D/g, ""), L = paraIG(m.value).length;
      $("mwa").href = "https://wa.me/" + (n.length >= 7 ? wnum(n) : "") + "?text=" + encodeURIComponent(m.value);
      $("mwa").textContent = n.length >= 7 ? "Enviar por WhatsApp" + (sel ? " a " + first(sel.name) : "") : "Enviar por WhatsApp (eliges el chat)";
      $("mlen").innerHTML = L > LIM_IG ? '<span class="neg">' + L + ' / ' + LIM_IG + ' caracteres: muy largo para Instagram</span>' : L + ' / ' + LIM_IG + ' caracteres (límite de Instagram)';
    }
    function poner() { m.value = rellenar(oc[2], sel); upd(); }
    m.oninput = upd; $("mph").oninput = upd; poner();
    function llenar() {
      $("mcs").innerHTML = '<option value="">— Sin cliente / escribirle a alguien nuevo —</option>' + msgLista().map(function (x, i) { return '<option value="' + i + '">' + esc(x.name + " · " + x.service + " · " + x.fecha) + '</option>'; }).join("");
    }
    if (LIST) llenar(); else call({ action: "clientes", pin: PIN }).then(function (r) { LIST = r.list || []; YAPPY = r.yappy || YAPPY; llenar(); poner(); }).catch(function () {});
    $("mcs").onchange = function () {
      var L = msgLista(); sel = this.value === "" ? null : L[+this.value];
      $("mph").value = sel ? sel.phone : ""; var c = sel && BASE ? BASE.filter(function (z) { return String(z.phone).replace(/\D/g, "").slice(-8) === String(sel.phone).replace(/\D/g, "").slice(-8); })[0] : null; $("mig").value = c && c.instagram ? c.instagram : ""; $("mem").value = sel ? (sel.email || (c && c.email) || "") : "";
      poner();
    };
    cargaBase(function () { if ($("mcs") && !sel) llenar(); });
    function copiar(txt, ok) { if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, function () { m.select(); document.execCommand("copy"); ok(); }); else { m.select(); document.execCommand("copy"); ok(); } }
    $("mcp").onclick = function () { copiar(m.value, function () { $("mcs2").textContent = "✓ Copiado"; }); };
  }
  /* fotos de perfil: la portada (⭐) de la sesión del cliente en Publicar */
  var AV = null, AVC = false;
  function normN(n) { return String(n || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim(); }
  function avTag(name, phone, ids, big) {
    var t = String(phone || "").replace(/\D/g, ""), k = [].concat(ids || []).filter(Boolean).map(function (r) { return "r:" + r; });
    if (t.length >= 7) k.push("p:" + t.slice(-8) + "|" + (normN(name).split(" ")[0] || "")); if (name) k.push("n:" + normN(name));
    return '<span class="avs' + (big ? " big" : "") + '" data-av="' + esc(k.join("|")) + '" hidden></span>';
  }
  function pintaAv(root) {
    if (!AV) return;
    Array.prototype.forEach.call((root || app).querySelectorAll(".avs[data-av]"), function (el) {
      var keys = el.getAttribute("data-av").split("|"), fid = null;
      for (var i = 0; i < keys.length && !fid; i++) fid = AV.map[keys[i]];
      el.removeAttribute("data-av"); if (!fid || !AV.imgs[fid]) return;
      var im = document.createElement("img"); im.className = "avi" + (el.classList.contains("big") ? " big" : ""); im.src = AV.imgs[fid]; im.alt = "";
      var cl = el.closest(".cl"); if (cl) cl.classList.add("cav");
      var rep = el.parentNode && el.parentNode.classList && el.parentNode.classList.contains("av") ? el.parentNode : el; rep.replaceWith(im);
    });
  }
  function cargaAv() {
    if (AVC) return; AVC = true;
    try { var g = JSON.parse(localStorage.getItem("ncav") || "null"); if (g && g.map) { AV = g; pintaAv(); } } catch (e) {}
    call({ action: "avatares", pin: PIN }).then(function (r) { if (!r || !r.ok) return; AV = { map: r.map, imgs: r.imgs }; try { localStorage.setItem("ncav", JSON.stringify(AV)); } catch (e) {} pintaAv(); }).catch(function () {});
  }
  if (window.MutationObserver) { var TAV = 0; new MutationObserver(function () { if (!AV) return; clearTimeout(TAV); TAV = setTimeout(function () { pintaAv(); }, 30); }).observe(app, { childList: true, subtree: true }); }
  salir.onclick = function (e) { e.preventDefault(); setPin(""); PIN = ""; pinView(); };
  /* botón atrás del teléfono: mientras en pantalla hay un «‹ Atrás», el atrás del teléfono lo toca en vez de salir */
  var GUARDA = false, SALTA_POP = false, TSINC = 0;
  function sincAtras() {
    if (LBX) return;
    var b = app.querySelector(".back");
    if (b && !GUARDA) { try { history.pushState({ nc: 1 }, ""); GUARDA = true; } catch (e) { } }
    else if (!b && GUARDA) { GUARDA = false; SALTA_POP = true; try { history.back(); } catch (e) { SALTA_POP = false; } }
  }
  if (window.MutationObserver) new MutationObserver(function () { clearTimeout(TSINC); TSINC = setTimeout(sincAtras, 40); }).observe(app, { childList: true, subtree: true });
  window.addEventListener("popstate", function () {
    if (SALTA_POP) { SALTA_POP = false; return; }
    if (LBX) return; // la vista grande de una foto se cierra sola
    GUARDA = false;
    var b = app.querySelector(".back");
    if (b) { b.click(); window.scrollTo(0, 0); }
    setTimeout(sincAtras, 80);
  });
  if (PIN) { inicio(); cargaAv(); } else pinView();
})();
</script>
