<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Agendar · NC Studio</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#F2E4D2;--card:#FEFEFE;--fg:#222020;--muted:#5d5650;--line:#D9CDBE;--accent:#F99824;--soft:#FDF1E2;--err:#B42318}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--fg);font-size:16px}
.top{background:var(--fg);padding:14px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:14px}
.top img{height:36px;display:block}.top span{color:var(--bg);font-family:Georgia,serif;font-size:20px}
.top a{margin-left:auto;color:var(--bg);font-size:13px}
.bar{height:5px;background:var(--accent)}
main{max-width:760px;margin:0 auto;padding:18px max(16px,env(safe-area-inset-left)) 120px;display:grid;gap:16px}
section{background:var(--card);border-radius:10px;padding:18px 18px 20px;display:grid;gap:12px}
h2{margin:0;font-family:Georgia,serif;font-weight:400;font-size:22px}
label{display:grid;gap:6px;font-size:14px;font-weight:bold}
label small{font-weight:normal;color:var(--muted)}
input,select,textarea{font:inherit;font-weight:normal;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--fg);width:100%;min-width:0}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);border-color:var(--accent)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.g2{grid-template-columns:1fr}}
.inc{margin:0;padding:10px 12px 10px 30px;background:var(--soft);border-radius:6px;font-size:14px;line-height:1.6}
.ex{display:grid;grid-template-columns:1fr 100px 44px;gap:8px;align-items:center}
.x{border:1px solid var(--line);background:#fff;border-radius:6px;height:44px;font-size:20px;cursor:pointer;color:var(--fg)}
.btn{font:bold 16px Arial,sans-serif;border:0;border-radius:8px;padding:15px 22px;cursor:pointer;background:var(--accent);color:var(--fg)}
.btn2{font:bold 14px Arial,sans-serif;border:1px dashed var(--muted);background:transparent;border-radius:6px;padding:10px 14px;cursor:pointer;color:var(--fg);justify-self:start}
.radio{display:flex;gap:10px;align-items:flex-start;font-weight:normal;font-size:15px;grid-template-columns:none;padding:12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.radio input{width:20px;height:20px;flex:none;margin:1px 0 0;accent-color:var(--accent)}
.sum{display:grid;gap:6px;font-size:15px}.sum div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.sum .t{font-size:20px;font-weight:bold;border-top:1px solid var(--line);padding-top:8px}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--fg);color:var(--bg);padding:12px max(16px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:14px;justify-content:space-between}
.foot b{font-size:20px;font-variant-numeric:tabular-nums}.foot small{display:block;font-size:12px;opacity:.8}
.err{color:var(--err);font-size:14px;margin:0}
.msg{background:var(--card);border-radius:10px;padding:22px;line-height:1.6}.msg h2{margin-bottom:8px}
.spin{width:22px;height:22px;border:3px solid var(--bg);border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.hint{font-size:13px;color:var(--muted);margin:0}
.tabs{display:flex;background:var(--fg);padding:0 max(16px,env(safe-area-inset-left));gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;max-width:200px;white-space:nowrap;font:bold 15px Arial,sans-serif;background:transparent;color:var(--bg);border:0;border-bottom:4px solid transparent;padding:12px 8px;cursor:pointer}
.tabs button[aria-pressed="true"]{border-bottom-color:var(--accent);color:#fff}
@media (max-width:480px){.tabs{gap:0;padding:0 8px}.tabs button{font-size:13px;padding:12px 6px}}
.cl{display:grid;gap:4px;text-align:left;width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;cursor:pointer;font:inherit;color:var(--fg)}
.cl b{font-size:17px}.cl span{font-size:14px;color:var(--muted)}
.chip{display:inline-block;font-size:12px;font-weight:bold;padding:3px 8px;border-radius:99px;background:var(--soft);color:var(--fg);justify-self:start}
.chip.ok{background:#D1FADF}.chip.wait{background:#FEF0C7}.chip.no{background:#FEE4E2}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:420px){.acts{grid-template-columns:1fr}}
.act{font:bold 15px Arial,sans-serif;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:13px 14px;cursor:pointer;color:var(--fg)}
.act[aria-pressed="true"]{border-color:var(--accent);background:var(--soft)}
.wa{display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#0b2e17;font:bold 17px Arial,sans-serif;text-decoration:none;border-radius:8px;padding:16px}
.back{background:none;border:0;font:bold 15px Arial,sans-serif;color:var(--fg);cursor:pointer;padding:4px 0;justify-self:start}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--soft);border-radius:8px;padding:12px 14px;display:grid;gap:2px}.kpi b{font-size:20px;font-variant-numeric:tabular-nums}.kpi span{font-size:13px;color:var(--muted)}
.mv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.mv .m{font-weight:bold;font-variant-numeric:tabular-nums;text-align:right}.mv .m.in{color:#067647}.mv small{color:var(--muted);font-size:13px;grid-column:1/-1}
.mv .ac{grid-column:1/-1;display:flex;gap:8px}.mv .ac button{font:bold 13px Arial,sans-serif;background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--fg)}
.card2{border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:10px;background:#fff}
.card2 .top2{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}.card2 .top2 b{font-size:18px;font-variant-numeric:tabular-nums}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}@media (max-width:560px){.g3{grid-template-columns:1fr}}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button{font:bold 14px Arial,sans-serif;border:1.5px solid var(--fg);background:transparent;color:var(--fg);border-radius:999px;padding:9px 16px;cursor:pointer}.seg button[aria-pressed="true"]{background:var(--fg);color:#fff}
.tb{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}.tb td,.tb th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.tb td:first-child,.tb th:first-child{text-align:left;white-space:normal}.tb th{font-size:12px;color:var(--muted)}.tb tr.tot td{font-weight:bold;background:var(--soft)}
.bar{height:8px;border-radius:4px;background:var(--accent)}.neg{color:var(--err)}.pos{color:#067647}
.scx{overflow-x:auto;margin:0 -4px;padding:0 4px}
.xg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.xc{display:grid;grid-template-rows:auto 1fr;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;cursor:pointer;font:inherit;color:var(--fg)}
.xc img,.xc .xall{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:center 30%;display:block;background:var(--fg)}
.xc .xall{display:flex;align-items:center;justify-content:center;color:var(--accent);font:400 34px Georgia,serif}
.xc span{display:grid;gap:2px;padding:10px 12px 12px}.xc b{font-size:15px}.xc small{font-size:12px;color:var(--muted)}
.ig{font:bold 17px Arial,sans-serif;border:0;border-radius:8px;padding:16px;cursor:pointer;color:#fff;background:linear-gradient(45deg,#C13584,#E1306C,#F77737)}
.fes{display:grid;gap:10px}
.fe{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;font:inherit;color:var(--fg);width:100%}
.fe .fei{font-size:30px;line-height:1;width:48px;flex:none;display:flex;justify-content:center}.fe .fei img{width:48px;height:48px;object-fit:contain}.fe span{display:grid;gap:3px}.fe b{font-size:18px;font-family:Georgia,serif;font-weight:400}.fe small{font-size:13px;color:var(--muted)}
.seg.sub button{font-size:13px;padding:7px 12px;border-width:1px}
.pfotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}@media (min-width:560px){.pfotos{grid-template-columns:repeat(4,1fr)}}
.pf{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:var(--fg)}.pf a,.pf img,.pf .xall{display:block;width:100%;height:100%;object-fit:cover}
.pf .xall{display:flex;align-items:center;justify-content:center;color:var(--bg);font-size:11px}
.pst{position:absolute;right:4px;top:4px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(34,32,32,.55);color:#fff;font-size:15px;cursor:pointer;line-height:1}.pst.on{background:var(--accent);color:var(--fg)}
.chk{display:flex;gap:8px;align-items:center;font-weight:normal;grid-template-columns:none}.chk input{width:20px;height:20px;accent-color:var(--accent)}
</style>
</head>

      '<div class="row" style="gap:6px">' + resumenPlan(x) + '</div>' +
      '<button class="btn2" id="' + s + 'tg" aria-expanded="' + abierta + '">' + (abierta ? "Cerrar ▴" : "Planificar ▾") + '</button><div id="' + s + 'bd" style="display:grid;gap:12px"' + (abierta ? "" : " hidden") + '>' +
      Object.keys(TIPOS).map(function (k) {
        var it = x.plan[k];
        return '<div class="card2" style="gap:8px"><div class="row" style="justify-content:space-between"><b>' + TIPOS[k] + '</b><span class="chip ' + (it.estado === "publicado" ? "ok" : it.estado === "programado" ? "wait" : it.estado === "no" ? "no" : "") + '" id="' + s + k + 'c">' + EST[it.estado] + (it.estado === "publicado" && it.fecha ? " · " + esc(fechaBonita(it.fecha).replace(/ ·.*/, "")) : "") + '</span></div>' +
          '<div class="g2"><label for="' + s + k + 'e">Estado<select id="' + s + k + 'e">' + Object.keys(EST).map(function (e) { return '<option value="' + e + '"' + (e === it.estado ? " selected" : "") + '>' + EST[e] + '</option>'; }).join("") + '</select></label>' +
          '<label for="' + s + k + 'f">Fecha y hora<input id="' + s + k + 'f" type="datetime-local" value="' + esc(it.fecha || "") + '"></label></div>' +
          (it.estado !== "publicado" ? '<button class="btn2" data-ya="' + s + k + '">✓ Ya lo publiqué</button>' : "") + '</div>';
      }).join("") +
      '<label for="' + s + 'n">Idea para el contenido <small>(canción, fotos favoritas, texto…)</small><textarea id="' + s + 'n" style="min-height:60px"></textarea></label>' +
      '<div class="row"><button class="btn" id="' + s + 'ok">Guardar y poner en el calendario</button><button class="btn2" id="' + s + 'sg">Sugerir fechas</button><span class="hint" id="' + s + 'st"></span></div>' +
      '<div class="row"><button class="btn2" id="' + s + 'del" style="border-color:var(--err);color:var(--err)">Quitar de la lista</button></div></div></section>';
  }
  function bindPub(x, s) {
    $(s + "n").value = x.notas || "";
    $(s + "tg").onclick = function () { var bd = $(s + "bd"), ab = bd.hidden; bd.hidden = !ab; if (ab) PUB_OPEN[x.id] = 1; else delete PUB_OPEN[x.id]; this.textContent = ab ? "Cerrar ▴" : "Planificar ▾"; this.setAttribute("aria-expanded", ab); };
    Object.keys(TIPOS).forEach(function (k) {
      $(s + k + "f").onchange = function () { if (this.value && ($(s + k + "e").value === "pendiente")) $(s + k + "e").value = "programado"; };
    });
    function datos() { var p = { id: x.id, notas: $(s + "n").value, plan: {} }; Object.keys(TIPOS).forEach(function (k) { p.plan[k] = { estado: $(s + k + "e").value, fecha: $(s + k + "f").value }; }); return p; }
    function guardar(p, b, lb) {
      b.disabled = true; b.innerHTML = '<span class="spin"></span>Guardando…';
      call({ action: "pub_save", pin: PIN, p: p }).then(function (r) {
        if (!r.ok) { b.disabled = false; b.textContent = lb; $(s + "st").textContent = r.title; return; }
        PUB = PUB.map(function (y) { return y.id === x.id ? Object.assign({}, y, { plan: r.plan, estado: r.estado, notas: p.notas }) : y; });
        PUB_OPEN[x.id] = 1;
        if (DET === x.id) { var nx = PUB.filter(function (y) { return y.id === x.id; })[0]; if (r.estado !== "Por publicar") PV = "hechas"; pubDet(nx); var st = $("d0st"); if (st) st.innerHTML = '<span class="pos">✓ Guardado</span>'; }
        else pintaPub(r.estado === "Por publicar" ? x.id : null);
      }).catch(function () { b.disabled = false; b.textContent = lb; $(s + "st").textContent = "No pudimos conectar."; });
    }
    $(s + "ok").onclick = function () {
      var p = datos(), falta = Object.keys(TIPOS).filter(function (k) { return p.plan[k].estado === "programado" && !p.plan[k].fecha; });
      if (falta.length) { $(s + "st").innerHTML = '<span class="neg">Ponle fecha a: ' + falta.map(function (k) { return TIPOS[k]; }).join(", ") + '</span>'; return; }
      guardar(p, $(s + "ok"), "Guardar y poner en el calendario");
    };
    Array.prototype.forEach.call(document.querySelectorAll('[data-ya^="' + s + '"]'), function (b) {
      b.onclick = function () { var k = b.getAttribute("data-ya").slice(s.length), p = datos(); p.plan[k].estado = "publicado"; guardar(p, b, "✓ Ya lo publiqué"); };
    });
    $(s + "sg").onclick = function () {
      // reel al día siguiente 7 p. m., historias ese mismo día 9 a. m., carrusel 2 días después del reel 12 m.; sin chocar con otras ya programadas
      var ocup = {}; PUB.forEach(function (y) { if (y.id === x.id) return; Object.keys(TIPOS).forEach(function (k) { var it = y.plan[k]; if (it.estado === "programado" && it.fecha) ocup[it.fecha.slice(0, 10)] = 1; }); });
      var b0 = new Date(); b0.setHours(0, 0, 0, 0); b0.setDate(b0.getDate() + 1);
      function libre(d) { while (ocup[isoLocal(d).slice(0, 10)]) d.setDate(d.getDate() + 1); ocup[isoLocal(d).slice(0, 10)] = 1; return d; }
      var reel = libre(new Date(b0)); reel.setHours(19, 0);
      var car = new Date(reel); car.setDate(car.getDate() + 2); car = libre(car); car.setHours(12, 0);
      var his = new Date(reel); his.setHours(9, 0);
      [["reel", reel], ["carrusel", car], ["historias", his]].forEach(function (a) {
        var e = $(s + a[0] + "e"); if (e.value === "publicado" || e.value === "no") return;
        $(s + a[0] + "f").value = isoLocal(a[1]); e.value = "programado";
      });
      $(s + "st").textContent = "Revisa las fechas y toca «Guardar».";
    };
    $(s + "del").onclick = function () {
      var b = $(s + "del"); if (!b.dataset.ok) { b.dataset.ok = 1; b.textContent = "¿Seguro? Toca otra vez"; return; }
      b.disabled = true; call({ action: "pub_del", pin: PIN, id: x.id }).then(function () { DET = null; PORTADAS = null; publicar(); });
    };
  }

  /* ===================== EXPERIENCIAS ===================== */
  var SITE = "https://ncstudio507.github.io/", LIBRE = null;
  function precioN(p) { return parseFloat(String(p).replace(/[^0-9.]/g, "")) || 0; }
  function lineaProp(q) {
    var it = (q.items || []).join(" | "), h = it.match(/(\d+(?:[.,]\d+)?)\s*horas?\s+de\s+(sesión|cobertura)/i), f = it.match(/(\d+)\s+fotos?\s+editadas(\s+por sesión)?/i);
    var partes = []; if (h) partes.push(h[1] + (h[1] === "1" ? " hora" : " horas") + " de " + h[2].toLowerCase()); if (f) partes.push(f[1] + " fotos editadas" + (f[2] || ""));
    return "• *" + q.price + "*" + (q.note && !/^USD$/i.test(q.note) ? " " + q.note.replace(/^USD\s*·?\s*/i, "") : "") + " — " + (partes.length ? partes.join(" · ") : q.name);
  }
  function linkExp(p) { return p ? SITE + "#" + p.id : SITE + "#portafolio"; }
  // Mensajes cortos: Instagram acepta hasta 1000 caracteres por mensaje directo; los dejamos muy por debajo para que se lean de un vistazo.
  var LIM_IG = 1000;
  function lineaCorta(q) {
    var it = (q.items || []).join(" | "), h = it.match(/(\d+(?:[.,]\d+)?)\s*horas?\s+de\s+(sesión|cobertura)/i), f = it.match(/(\d+)\s+fotos?\s+editadas(\s+por sesión)?/i);
    var partes = []; if (h) partes.push(h[1] + " h"); if (f) partes.push(f[1] + " fotos editadas" + (f[2] ? " por sesión" : ""));
    return "• *" + q.price + "*" + (q.note && !/^USD$/i.test(q.note) ? " " + q.note.replace(/^USD\s*·?\s*/i, "") : "") + (partes.length ? " — " + partes.join(" · ") : (q.name && !/^Propuesta/.test(q.name) ? " — " + q.name.toLowerCase() : ""));
  }
  function msgExp(p, tipo, nombre) {
    var n = nombre ? first(nombre) : "", hola = n ? "¡Hola, " + n + "! 💛" : "¡Hola! 💛";
    var lib = LIBRE ? "Tenemos fechas desde el *" + LIBRE + "*. " : "";
    if (tipo === "seg") return "Hola" + (n ? ", " + n : "") + " 💛 ¿Pudiste ver la información de *" + (p ? p.title : "nuestras experiencias") + "*? Si tienes alguna duda o quieres adaptar algo, con gusto te ayudo; también podemos hacer una llamada de 15 minutos. 😊\n\n" + linkExp(p) + "\n\n— Nelson · NC Studio";
    if (tipo === "link") return "✨ *" + (p ? p.title : "Experiencias NC Studio") + "*" + (p && p.kind ? " · " + p.kind : "") + "\nMira lo que incluye y reserva aquí 👇\n" + linkExp(p);
    if (!p) return hola + " Soy Nelson de NC Studio. ¡Qué alegría que quieras hacer tus fotos con nosotros! ✨\n\nAquí están todas nuestras experiencias: cumpleaños, XV años, embarazo, bebés, graduaciones y eventos, con precios y lo que incluye cada una 👇\n" + linkExp(null) + "\n\n" + lib + "¿Te ayudo a elegir? 😊";
    var props = p.props.slice().sort(function (a, b) { return precioN(a.price) - precioN(b.price); });
    return hola + " Soy Nelson de NC Studio. ¡Qué alegría que quieras hacer tus fotos con nosotros! ✨\n\nTe comparto *" + p.title + "*" + (p.kind ? " (" + p.kind.charAt(0).toLowerCase() + p.kind.slice(1) + ")" : "") + ":\n" + props.map(lineaCorta).join("\n") +
      "\n\nAquí ves todo lo que incluye y reservas tu fecha 👇\n" + linkExp(p) + "\n\n" + lib + "¿Te ayudo con alguna duda? 😊";
  }
  function paraIG(t) { return t.replace(/\*([^*\n]+)\*/g, "$1"); } // Instagram no usa *negritas*
  function primeraLibre(cb) {
    if (LIBRE !== null) { cb(); return; }
    call({ action: "ocupado" }).then(function (r) {
      var busy = (r && r.busy) || [], d = new Date(); d.setDate(d.getDate() + 1);
      for (var i = 0; i < 120; i++) { var s = isoLocal(d).slice(0, 10); if (busy.indexOf(s) < 0) break; d.setDate(d.getDate() + 1); }
      var DL = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"], ML = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
      LIBRE = DL[d.getDay()] + " " + d.getDate() + " de " + ML[d.getMonth()]; cb();
    }).catch(function () { LIBRE = ""; cb(); });
  }
  var PARA = { name: "", phone: "", instagram: "" }, XCAT = "ses";
  var XGRUPOS = { ses: ["Sesiones", ["levelup", "suenos", "dulce", "bebe", "estudio", "folklore", "granext", "gameon"]], ev: ["Eventos y carreras", ["infantil", "limitless"]], grad: ["Graduaciones", ["primer", "gran", "granext"]], todo: ["Todas", null] };
  function paraTxt() { return PARA.name || PARA.phone ? esc(PARA.name || "Sin nombre") + (PARA.phone ? " · " + esc(PARA.phone) : "") + (PARA.instagram ? " · @" + esc(PARA.instagram) : "") : "nadie elegido (eliges el chat al enviar)"; }
  function experiencias(cli) {
    tab("E"); salir.hidden = false;
    if (cli) PARA = { name: cli.name || "", phone: cli.phone || "", instagram: cli.instagram || "" };
    var L = XCAT === "todo" ? [null].concat(DATA.X) : DATA.X.filter(function (p) { return XGRUPOS[XCAT][1].indexOf(p.id) >= 0; });
    app.innerHTML = '<section style="gap:8px"><div class="row" style="justify-content:space-between"><span><small class="hint">Para:</small><br><b id="xpt">' + paraTxt() + '</b></span><button class="btn2" id="xpb">' + (PARA.name || PARA.phone ? "Cambiar" : "Elegir cliente") + '</button></div>' +
      '<div id="xpf" hidden style="display:grid;gap:10px"><label for="xq">Cliente <small>(busca en tu base o escribe un nombre)</small><input id="xq" list="xql" autocomplete="off" placeholder="Nombre"></label><datalist id="xql"></datalist>' +
      '<div class="g2"><label for="xph">WhatsApp<input id="xph" inputmode="tel" autocomplete="off"></label><label for="xig">Instagram <small>(sin @)</small><input id="xig" autocomplete="off"></label></div><button class="btn2" id="xpl">Listo</button></div></section>' +
      '<div class="seg" role="group" aria-label="Tipo de experiencia">' + Object.keys(XGRUPOS).map(function (k) { return '<button data-xg="' + k + '" aria-pressed="' + (XCAT === k) + '">' + XGRUPOS[k][0] + '</button>'; }).join("") + '</div>' +
      '<div class="xg">' + L.map(function (p) {
        var i = p ? DATA.X.indexOf(p) + 1 : 0;
        return '<button class="xc" data-xi="' + i + '">' + (p && p.img ? '<img src="' + esc(p.img) + '" alt="" loading="lazy">' : '<div class="xall">NC</div>') + '<span><b>' + esc(p ? p.title : "Todas las experiencias") + '</b><small>' + esc(p ? p.kind || "" : "El portafolio completo") + '</small>' +
          (p ? '<small>desde ' + esc(p.props.map(function (q) { return q.price; }).sort(function (a, b) { return precioN(a) - precioN(b); })[0]) + '</small>' : "") + '</span></button>';
      }).join("") + '</div>';
    $("xq").value = PARA.name; $("xph").value = PARA.phone; $("xig").value = PARA.instagram;
    function toggle(open) { $("xpf").hidden = !open; $("xpb").hidden = open; $("xpt").innerHTML = paraTxt(); }
    $("xpb").onclick = function () { toggle(true); $("xq").focus(); };
    $("xpl").onclick = function () { toggle(false); $("xpb").textContent = PARA.name || PARA.phone ? "Cambiar" : "Elegir cliente"; };
    cargaBase(function () { if (BASE && $("xql")) $("xql").innerHTML = BASE.map(function (c) { return '<option value="' + esc(c.name) + '">' + esc(c.phone) + '</option>'; }).join(""); });
    $("xq").oninput = function () {
      PARA.name = this.value; var v = this.value.trim().toLowerCase(), c = BASE && BASE.filter(function (z) { return z.name.toLowerCase() === v; })[0];
      if (c) { $("xph").value = PARA.phone = c.phone || ""; $("xig").value = PARA.instagram = c.instagram || ""; }
    };
    $("xph").oninput = function () { PARA.phone = this.value; }; $("xig").oninput = function () { PARA.instagram = this.value.replace(/^@/, ""); };
    Array.prototype.forEach.call(app.querySelectorAll("[data-xg]"), function (b) { b.onclick = function () { XCAT = b.getAttribute("data-xg"); experiencias(); }; });
    Array.prototype.forEach.call(app.querySelectorAll("[data-xi]"), function (b) { b.onclick = function () { var i = +b.getAttribute("data-xi"); primeraLibre(function () { enviarExp(i ? DATA.X[i - 1] : null, "pri"); }); }; });
  }
  function enviarExp(p, tipo) {
    tab("E"); window.scrollTo(0, 0);
    app.innerHTML = '<button class="back" id="xbk">‹ Experiencias</button><section><h2>' + esc(p ? p.title : "Todas las experiencias") + '</h2><p class="hint" style="margin-top:-6px">Para: ' + paraTxt() + '</p>' +
      '<div class="seg" role="group" aria-label="Tipo de mensaje"><button data-xt="pri" aria-pressed="' + (tipo === "pri") + '">Primer contacto</button><button data-xt="seg" aria-pressed="' + (tipo === "seg") + '">Seguimiento</button><button data-xt="link" aria-pressed="' + (tipo === "link") + '">Solo el link</button></div>' +
      '<label for="xm">Puedes editarlo antes de enviar<textarea id="xm" style="min-height:250px"></textarea></label><p class="hint" id="xlen" style="text-align:right;margin-top:-6px"></p>' +
      '<a class="wa" id="xwa" target="_blank" rel="noopener">Enviar por WhatsApp</a>' +
      '<button class="ig" id="xig2">Copiar y abrir Instagram</button><p class="hint" id="xigs">Instagram no deja escribir el mensaje solo: lo copio sin los asteriscos, se abre el chat y lo pegas (mantén presionado → Pegar).</p>' +
      '<div class="row"><button class="btn2" id="xcp">Copiar mensaje</button><a class="btn2" href="' + esc(linkExp(p)) + '" target="_blank" rel="noopener" style="text-decoration:none">Ver la página ↗</a><span class="hint" id="xcs"></span></div></section>';
    $("xbk").onclick = function () { experiencias(); };
    var m = $("xm"); m.value = msgExp(p, tipo, PARA.name.trim());
    function upd() {
      var n = String(PARA.phone || "").replace(/\D/g, ""), L = paraIG(m.value).length;
      $("xwa").href = "https://wa.me/" + (n.length >= 7 ? wnum(n) : "") + "?text=" + encodeURIComponent(m.value);
      $("xwa").textContent = n.length >= 7 ? "Enviar por WhatsApp a " + (first(PARA.name) || PARA.phone) : "Enviar por WhatsApp (eliges el chat)";
      $("xlen").innerHTML = L > LIM_IG ? '<span class="neg">' + L + ' / ' + LIM_IG + ' caracteres: muy largo para Instagram, acórtalo</span>' : L + ' / ' + LIM_IG + ' caracteres (límite de Instagram)';
    }
    m.oninput = upd; upd();
    function copiar(txt, ok) { if (navigator.clipboard) navigator.clipboard.writeText(txt).then(ok, function () { m.select(); document.execCommand("copy"); ok(); }); else { m.select(); document.execCommand("copy"); ok(); } }
    $("xcp").onclick = function () { copiar(m.value, function () { $("xcs").textContent = "✓ Copiado"; }); };
    $("xig2").onclick = function () {
      var u = String(PARA.instagram || "").replace(/^@/, "").trim(), url = u ? "https://ig.me/m/" + encodeURIComponent(u) : "https://www.instagram.com/direct/inbox/";
      var w = window.open(url, "_blank", "noopener"); copiar(paraIG(m.value), function () { $("xigs").innerHTML = '<span class="pos">✓ Mensaje copiado.</span> En el chat de Instagram, mantén presionado y toca «Pegar».'; });
      if (!w) location.href = url;
    };
    Array.prototype.forEach.call(app.querySelectorAll("[data-xt]"), function (b) { b.onclick = function () { enviarExp(p, b.getAttribute("data-xt")); }; });
  }
  salir.onclick = function (e) { e.preventDefault(); setPin(""); PIN = ""; pinView(); };
  if (PIN) inicio(); else pinView();
})();
</script>
