<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color" content="#222020">
<link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body>
<header class="hd">
  <a href="index.html" aria-label="NC Studio, página principal"><img src="logo.png" alt="NC Studio"></a>
  <nav aria-label="Menú principal"><a href="index.html">🏠 Inicio</a><a href="news.html" class="on" aria-current="page">📰 News</a><a href="vip.html">👑 Zona VIP</a></nav>
</header>
<main class="wrap">
  <h1>News</h1>
  <p class="sub">Galerías de carreras y eventos, novedades y consejos de NC Studio.</p>
  <div class="filtros">
    <input id="q" class="buscar" type="search" placeholder="Buscar evento, lugar…" aria-label="Buscar evento">
    <div id="tipos" class="fila" style="margin:0"></div>
    <div id="anios" class="fila" style="margin:0"></div>
  </div>
  <div class="cargando" id="carga" role="status" style="padding:10px 16px 26px">
    <svg class="camarita" viewBox="0 0 132 112" aria-hidden="true">
      <defs>
        <linearGradient id="ncPlata" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6f6f4"/><stop offset=".5" stop-color="#c4c4c1"/><stop offset="1" stop-color="#e4e4e1"/></linearGradient>
        <pattern id="ncCuero" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="4" fill="#1c1c1e"/><circle cx="1" cy="1" r=".8" fill="#2b2b2e"/><circle cx="3" cy="3" r=".7" fill="#121214"/></pattern>
        <pattern id="ncEstria" width="3" height="10" patternUnits="userSpaceOnUse"><rect width="3" height="10" fill="#b9b9b6"/><rect width="1.4" height="10" fill="#7d7d7a"/></pattern>
        <radialGradient id="ncVidrio" cx=".35" cy=".3"><stop offset="0" stop-color="#7d6aa8"/><stop offset=".35" stop-color="#2b3550"/><stop offset=".75" stop-color="#10141d"/><stop offset="1" stop-color="#07080b"/></radialGradient>
        <radialGradient id="ncFlash"><stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#fff8e6" stop-opacity=".95"/><stop offset="1" stop-color="#F99824" stop-opacity="0"/></radialGradient>
      </defs>
      <ellipse class="sombra" cx="66" cy="106" rx="42" ry="5" fill="#000"/>
      <g class="cam">
        <!-- ruedas estriadas arriba a la izquierda (la del frente es el disparador) y rueda de modos -->
        <rect x="16" y="17" width="20" height="10" rx="3" fill="url(#ncEstria)" stroke="#6f6f6c" stroke-width=".8"/>
        <rect class="boton" x="20" y="12" width="12" height="6" rx="3" fill="url(#ncPlata)" stroke="#7d7d7a" stroke-width=".8"/>
        <rect x="40" y="20" width="18" height="8" rx="3" fill="url(#ncEstria)" stroke="#6f6f6c" stroke-width=".8"/>
        <!-- zapata del flash -->
        <path d="M70 28 V22 H90 V28" fill="url(#ncPlata)" stroke="#7d7d7a" stroke-width=".8"/>
        <rect x="72" y="20" width="16" height="3" fill="#9a9a97"/>
        <!-- placa plateada de arriba -->
        <path d="M8 46 Q8 34 16 28 H116 Q124 28 124 36 V48 H8 Z" fill="url(#ncPlata)" stroke="#9a9a97" stroke-width="1"/>
        <circle cx="113" cy="38" r="3.4" fill="#F99824"/>
        <!-- cuerpo negro con empuñadura a la izquierda -->
        <path d="M8 48 H124 V88 H8 Z" fill="url(#ncCuero)" stroke="#000" stroke-width="1"/>
        <path d="M8 48 H30 Q36 68 30 88 H8 Z" fill="#141416" stroke="#000" stroke-width="1"/>
        <path d="M10 50 H28 Q33 68 28 86 H10 Z" fill="url(#ncCuero)" opacity=".9"/>
        <circle cx="38" cy="56" r="2.6" fill="#2b2b2e" stroke="#555" stroke-width=".8"/>
        <!-- franja plateada de abajo -->
        <path d="M8 88 H124 V91 Q124 96 118 96 H14 Q8 96 8 91 Z" fill="url(#ncPlata)" stroke="#9a9a97" stroke-width="1"/>
        <rect x="123" y="40" width="4" height="10" rx="2" fill="url(#ncPlata)"/>
        <!-- lente zoom grande, corrido a la derecha -->
        <circle cx="76" cy="66" r="31" fill="#121214" stroke="#2a2a2d" stroke-width="2"/>
        <circle cx="76" cy="66" r="27" fill="none" stroke="#3a3a3e" stroke-width="5" stroke-dasharray="1.4 1.6"/>
        <circle cx="76" cy="66" r="22" fill="#0d0d0f" stroke="#4a4a4f" stroke-width="1.2"/>
        <circle cx="76" cy="66" r="16.5" fill="url(#ncVidrio)" stroke="#2a2a2d" stroke-width="1.4"/>
        <g class="iris">
          <path d="M76 52 L81 63 M89 59 L80 68 M87 75 L74 71 M71 80 L71 67 M62 72 L72 64 M65 57 L76 62" stroke="#07080b" stroke-width="2.4" stroke-linecap="round"/>
          <circle cx="76" cy="66" r="4.6" fill="#040506"/>
        </g>
        <ellipse cx="69" cy="58" rx="5" ry="3" fill="#fff" opacity=".5" transform="rotate(-30 69 58)"/>
        <circle cx="84" cy="74" r="2" fill="#c9b8ff" opacity=".55"/>
        <!-- destello del flash desde la zapata -->
        <circle class="flash" cx="80" cy="18" r="30" fill="url(#ncFlash)"/>
        <path class="flash" d="M80 -10v12M80 32v6M52 18h12M96 18h12M60 -2l8 8M92 30l8 8M100 -2l-8 8M68 30l-8 8" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
      </g>
    </svg>
    <div class="clic">¡CLIC!</div>
    <b>Cargando las galerías…</b>
    <div class="llenar" id="cargaBarra"><i></i></div>
  </div>
  <div id="lista" class="eventos">
    <!-- se ve al instante mientras llega la lista (24-11-2026) -->
    <div class="ev esq" aria-hidden="true"><div class="por"></div><div class="tx"><div class="l c"></div><div class="l m"></div><div class="l c"></div></div></div>
    <div class="ev esq" aria-hidden="true"><div class="por"></div><div class="tx"><div class="l c"></div><div class="l m"></div><div class="l c"></div></div></div>
    <div class="ev esq" aria-hidden="true"><div class="por"></div><div class="tx"><div class="l c"></div><div class="l m"></div><div class="l c"></div></div></div>
  </div>
  <p id="vacio" class="vacio" hidden>No hay eventos con ese filtro.</p>
</main>
<script src="nc-config.js"></script>
<script>if (!(window.NC_CONFIG || {}).url) document.write('<script src="datos-prueba.js"><\/script>');</script>
<script src="tienda.js"></script>
<script src="nc-api.js?v=20261124"></script>
<script>
(function () {
  var EV = [], filtro = { q: '', tipo: 'todos', anio: 'todos' };
  var MESES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
  function fecha(f) { var p = f.split('-'); return +p[2] + ' ' + MESES[+p[1] - 1] + ' ' + p[0]; }
  function norm(s) { return String(s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function chips(el, valores, clave) {
    el.innerHTML = '';
    valores.forEach(function (v) {
      var b = document.createElement('button');
      b.className = 'chip' + (filtro[clave] === v ? ' on' : '');
      b.textContent = v === 'todos' ? (clave === 'tipo' ? 'Todo' : 'Todos los años') : v.charAt(0).toUpperCase() + v.slice(1) + (clave === 'tipo' ? 's' : '');
      b.onclick = function () { filtro[clave] = v; pintar(); };
      el.appendChild(b);
    });
  }
  function pintar() {
    var tipos = ['todos'].concat(EV.map(function (e) { return e.tipo; }).filter(function (v, i, a) { return a.indexOf(v) === i; }));
    var anios = ['todos'].concat(EV.map(function (e) { return e.fecha.slice(0, 4); }).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort().reverse());
    chips(document.getElementById('tipos'), tipos, 'tipo');
    chips(document.getElementById('anios'), anios, 'anio');
    var lista = document.getElementById('lista'); lista.innerHTML = '';
    var q = norm(filtro.q), vis = EV.filter(function (e) {
      return (filtro.tipo === 'todos' || e.tipo === filtro.tipo) && (filtro.anio === 'todos' || e.fecha.indexOf(filtro.anio) === 0) &&
        (!q || norm(e.nombre + ' ' + e.lugar).indexOf(q) >= 0);
    }).sort(function (a, b) { return a.fecha < b.fecha ? 1 : -1; });
    vis.forEach(function (e) {
      var a = document.createElement('a'); a.className = 'ev'; a.href = 'evento.html?e=' + encodeURIComponent(e.id);
      var nf = e.nfotos != null ? e.nfotos : (e.fotos || []).length, extra = nf ? ' · ' + nf + ' fotos' : '';
      a.innerHTML = '<div class="por"></div><div class="tx"><div class="tipo"></div><h2></h2><div class="meta"></div></div>';
      a.querySelector('.por').style.backgroundImage = 'url("' + e.portada + '")';
      a.querySelector('.tipo').textContent = e.tipo;
      a.querySelector('h2').textContent = e.nombre;
      a.querySelector('.meta').textContent = fecha(e.fecha) + ' · ' + e.lugar + extra;
      // solo si Nelson lo liberó por patrocinio; si no, no sale nada
      var lib = e.liberado;
      if (lib) {
        var s = document.createElement('div'); s.className = 'sello-patrocinio';
        s.textContent = '🎉 Patrocinado' + (lib.patrocinador ? ' por ' + lib.patrocinador : '') + ' · 3 fotos gratis';
        a.querySelector('.tx').appendChild(s);
      }
      lista.appendChild(a);
    });
    document.getElementById('vacio').hidden = vis.length > 0;
    document.getElementById('vacio').textContent = EV.length ? 'No hay eventos con ese filtro.' : '📸 Muy pronto aquí vas a encontrar las fotos de las carreras y eventos donde estuvimos.';
  }
  document.getElementById('q').addEventListener('input', function () { filtro.q = this.value; pintar(); });
  // la lista de eventos la da el servidor (en el prototipo, la tienda de este navegador)
  // 24-11-2026: la última lista se guarda en el celular y se muestra al instante; luego se actualiza con la del servidor
  var CLAVE = 'nc-news-cache', carga = document.getElementById('carga'), barra = document.getElementById('cargaBarra');
  requestAnimationFrame(function () { requestAnimationFrame(function () { barra.classList.add('va'); }); });
  function sinCarga() { barra.classList.add('listo'); setTimeout(function () { carga.hidden = true; }, 280); }
  // si ya hay lista guardada en el celular, se ve al instante y la camarita no hace falta
  try { var c = JSON.parse(localStorage.getItem(CLAVE) || 'null'); if (c && c.length) { EV = c; pintar(); carga.hidden = true; } } catch (e) {}
  window.NC_API.gal('listaEventos', []).then(function (l) {
    EV = l || []; pintar(); sinCarga();
    try { localStorage.setItem(CLAVE, JSON.stringify(EV)); } catch (e) {}
  }, function () {
    sinCarga();
    if (EV.length) return;   // ya se ve la lista guardada
    document.getElementById('lista').innerHTML = '';
    document.getElementById('vacio').hidden = false; document.getElementById('vacio').textContent = 'Sin conexión. Inténtalo otra vez.';
  });
})();
</script>
</body>
</html>
