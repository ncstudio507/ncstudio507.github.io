<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Allura&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@500;600;700&family=Tenor+Sans&display=swap">
<style>
:root { --ground: #222020; color-scheme: light; }
body { margin: 0; background: var(--ground); color: #222020; }
a { color: #222020; } a:hover { color: #000000; }
button:focus-visible, a:focus-visible { outline: 3px solid #F99824; outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
html { scroll-behavior: smooth; }
summary::-webkit-details-marker { display: none; }
details[open] .faq-ico { transform: rotate(45deg); }
[id]{scroll-margin-top:72px}.nc-slogan{font-size:10px!important;letter-spacing:.12em!important;padding:5px 9px!important}@media (max-width:379px){.nc-slogan{font-size:9px!important;letter-spacing:.06em!important;padding:5px 7px!important}}@media (min-width:900px){.nc-slogan{font-size:13px!important;letter-spacing:.3em!important;padding:6px 12px!important}}.nc-nav-desk{display:none}.nc-menu-btn{display:inline-flex}@media (min-width:900px){.nc-nav-desk{display:flex}.nc-menu-btn{display:none}.nc-nav-mob{display:none!important}}
</style>
<div id="nc-root"></div>
<template id="nc-tpl">

<div style="width: 100%; background: #FEFEFE; color: #222020; font-family: 'Tenor Sans', Georgia, serif; font-size: 17px; line-height: 1.6">

<header style="position: sticky; top: 0; z-index: 60; background: #222020; border-bottom: 1px solid #3D3B3E">
<div style="max-width: 1160px; margin: 0 auto; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px 24px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; min-width: 0">
<a href="#quienes-somos" aria-label="NC Studio, inicio" style="display: flex; align-items: center; padding: 4px 0">
<img src="img/9829ea1d0acede8e44636a5e99bd7b84.png" alt="NC Studio" style="height: 40px; width: auto; display: block">
</a>
<p class="nc-slogan" style="margin: 0; background: {{accent}}; color: #222020; padding: 6px 12px; font-family: 'EB Garamond', Georgia, serif; font-size: clamp(10px, 2.9vw, 13px); letter-spacing: clamp(0.1em, 0.85vw, 0.3em); white-space: nowrap; max-width: 100%; box-sizing: border-box">PROFESIONAL · CERCANO · CREATIVO</p>
</div>
<nav class="nc-nav-desk" aria-label="Menú principal" style="align-items: center; gap: 26px; font-family: Montserrat, sans-serif; font-size: 15px; font-weight: 600; white-space: nowrap">
<a href="#quienes-somos" style="color: #F2E4D2; text-decoration: none; padding: 10px 0">Quiénes somos</a>
<a href="#portafolio" style="color: #F2E4D2; text-decoration: none; padding: 10px 0">Portafolio</a>
<a href="#portafolio" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 999px; background: {{accent}}; color: #222020; text-decoration: none">Reservar</a>
<button type="button" onClick="{{cot.openAny}}" style="display: inline-flex; align-items: center; min-height: 44px; padding: 0 20px; border-radius: 999px; border: 1.5px solid {{accent}}; background: transparent; color: #FEFEFE; font: inherit; cursor: pointer">Arma tu paquete personalizado</button>
</nav>
<button type="button" class="nc-menu-btn" onClick="{{menu.toggle}}" aria-expanded="{{menu.expanded}}" aria-controls="nc-menu" style="flex: none; align-items: center; gap: 6px; min-height: 44px; padding: 0 10px; border-radius: 6px; border: 1.5px solid #F2E4D2; background: transparent; color: #FEFEFE; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 14px; cursor: pointer">
<sc-if value="{{menu.closed}}" hint-placeholder-val="{{true}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
</sc-if>
<sc-if value="{{menu.open}}" hint-placeholder-val="{{false}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</sc-if>
Menú
</button>
</div>
<sc-if value="{{menu.open}}" hint-placeholder-val="{{false}}">
<nav id="nc-menu" class="nc-nav-mob" aria-label="Menú principal" style="display: flex; flex-direction: column; padding: 4px 20px 18px; border-top: 1px solid #3D3B3E; font-family: Montserrat, sans-serif; font-weight: 600">
<a href="#quienes-somos" onClick="{{menu.close}}" style="display: flex; align-items: center; min-height: 54px; border-bottom: 1px solid #3D3B3E; color: #FEFEFE; text-decoration: none; font-size: 17px">Quiénes somos</a>
<a href="#portafolio" onClick="{{menu.close}}" style="display: flex; align-items: center; min-height: 54px; border-bottom: 1px solid #3D3B3E; color: #FEFEFE; text-decoration: none; font-size: 17px">Portafolio</a>
<a href="#portafolio" onClick="{{menu.close}}" style="display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 16px; border-radius: 999px; background: {{accent}}; color: #222020; text-decoration: none; font-size: 16px; font-weight: 700">Reservar</a>
<button type="button" onClick="{{cot.openAny}}" style="display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: 10px; border-radius: 999px; border: 1.5px solid {{accent}}; background: transparent; color: #FEFEFE; font-family: Montserrat, sans-serif; font-size: 16px; font-weight: 700; cursor: pointer">Arma tu paquete personalizado</button>
</nav>
</sc-if>
</header>

<section id="quienes-somos" style="background: #222020; color: #FEFEFE; padding: 56px 20px 72px">
<div style="max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 48px">
<div style="flex: 1 1 440px; min-width: 0; display: flex; flex-direction: column; gap: 18px">
<p style="margin: 0; font-family: Allura, cursive; font-size: 44px; line-height: 1; color: {{accent}}">Hola,</p>
<h1 style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: clamp(40px, 6vw, 64px); line-height: 1.05">Somos Nelson y Charlie</h1>
<p style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 600; font-size: 18px; color: #F2E4D2">Fotografía y audiovisual en Las Tablas, Panamá, desde 2019</p>
<p style="margin: 0; max-width: 520px; color: #F2E4D2">Somos dos amigos apasionados por la fotografía. Acompañamos a quinceañeras, futuras mamás, familias, graduandos y deportistas a guardar sus momentos más importantes, con la creatividad, el estilo y la calidad que nos caracterizan.</p>
<p style="margin: 0; max-width: 520px; color: #F2E4D2">Te guiamos con seguridad, sin poses forzadas, para que todo fluya de forma natural, auténtica y con mucha vibra.</p>
<p style="margin: 6px 0 0; font-family: 'EB Garamond', Georgia, serif; font-style: italic; font-size: 28px; line-height: 1.2">No vendemos fotos, vendemos experiencias.</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px; margin-top: 8px">
<a href="#portafolio" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 26px; border-radius: 999px; background: {{accent}}; color: #222020; text-decoration: none; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px">Ver paquetes y precios</a>
<a href="#preguntas" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 26px; border-radius: 999px; border: 1.5px solid {{accent}}; background: transparent; color: #FEFEFE; text-decoration: none; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px">Preguntas frecuentes</a>
<a href="{{waGeneral}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 26px; border-radius: 999px; border: 1.5px solid #F2E4D2; color: #FEFEFE; text-decoration: none; font-family: Montserrat, sans-serif; font-weight: 600; font-size: 15px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.4 7.4L3 20.5l1.6-5.4A8.4 8.4 0 1 1 21 11.5z"></path></svg>
Escríbenos
</a>
</div>
</div>
<img src="img/5ed9f54d47c7461ec00ca1f815be185f.jpg" alt="Nelson y Charlie revisando fotos en la cámara" style="order: -1; flex: 1 1 400px; min-width: 0; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 6px; display: block">
</div>
</div>
</section>

<section id="portafolio" style="padding: 88px 20px">
<div style="max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-family: Montserrat, sans-serif; font-size: 16px; font-weight: 600; color: #3D3B3E">Portafolio</p>
<h2 style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: clamp(34px, 4.5vw, 52px); line-height: 1.1">Tu esencia, capturada con creatividad</h2>
<p style="margin: 0; color: #3D3B3E">Toca una experiencia para ver sus fotos y sus paquetes.</p>
</div>
<a href="https://instagram.com/ncstudio507" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 24px; border-radius: 999px; border: 1.5px solid #222020; color: #222020; text-decoration: none; font-family: Montserrat, sans-serif; font-weight: 600; font-size: 15px">Ver más en Instagram</a>
</div>
<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px">
<sc-for list="{{portfolio}}" as="g" hint-placeholder-count="10">
<button type="button" onClick="{{g.open}}" aria-label="Ver fotos de {{g.title}}" style="position: relative; display: block; padding: 0; border: 0; border-radius: 6px; overflow: hidden; background: #222020; cursor: pointer; text-align: left">
<img src="{{g.src}}" alt="" style="width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block">
<span style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 40px 8px 12px; background: linear-gradient(to top, rgba(34, 32, 32, 0.9), rgba(34, 32, 32, 0))">
<span style="font-family: 'EB Garamond', Georgia, serif; font-size: 22px; line-height: 1.05; color: #FEFEFE; text-align: center">{{g.title}}</span>
<span style="font-family: 'Tenor Sans', Georgia, serif; font-size: 11px; letter-spacing: 0.08em; line-height: 1.3; color: #F2E4D2; text-align: center">{{g.kind}}</span>
</span>
</button>
</sc-for>
</div>
</div>
</section>

<sc-if value="{{showPkg}}" hint-placeholder-val="{{true}}">
<section id="paquetes" style="background: #F2E4D2; padding: 88px 20px">
<div style="max-width: 1160px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px">
<sc-if value="{{showPkg}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 32px">
<div>
<button type="button" onClick="{{back}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 20px; border-radius: 6px; border: 1.5px solid #222020; background: #FEFEFE; color: #222020; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
Ver todas las experiencias
</button>
</div>


<div style="display: flex; flex-wrap: wrap; gap: 36px; align-items: center; background: #FEFEFE; border-radius: 10px; padding: 28px; box-sizing: border-box">
<img src="{{current.img}}" alt="{{current.imgAlt}}" style="flex: 0 1 300px; min-width: 0; width: 100%; max-width: 300px; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 6px; display: block">
<div style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<h3 style="margin: 0; font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: clamp(36px, 4.5vw, 54px); line-height: 1">{{current.title}}</h3>
<p style="margin: -4px 0 4px; font-family: 'Tenor Sans', Georgia, serif; font-size: 15px; letter-spacing: 0.12em; color: #3D3B3E">{{current.kind}}</p>
<p style="margin: 0; color: #3D3B3E">{{current.intro}}</p>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(270px, 1fr)); gap: 18px; align-items: stretch">
<sc-for list="{{current.proposals}}" as="p" hint-placeholder-count="3">
<article style="display: flex; flex-direction: column; gap: 16px; padding: 28px 24px; border-radius: 10px; border: 1.5px solid #222020; background: {{p.bg}}; color: {{p.fg}}">
<div style="display: flex; flex-direction: column; gap: 6px">
<sc-if value="{{p.badge}}" hint-placeholder-val="{{false}}">
<span style="align-self: flex-start; background: {{accent}}; color: #222020; font-family: Montserrat, sans-serif; font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px">Experiencia completa</span>
</sc-if>
<h4 style="margin: 0; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 19px">{{p.name}}</h4>
<p style="margin: 0; font-size: 15px; color: {{p.sub}}">{{p.desc}}</p>
</div>
<div style="display: flex; flex-direction: column">
<span style="font-family: 'EB Garamond', Georgia, serif; font-size: 46px; line-height: 1.05">{{p.price}}</span>
<span style="font-size: 14px; color: {{p.sub}}">{{p.priceNote}}</span>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; flex-grow: 1">
<sc-for list="{{p.items}}" as="it" hint-placeholder-count="6">
<li style="display: flex; gap: 10px; align-items: flex-start; font-size: 15px; line-height: 1.45">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
<span>{{it}}</span>
</li>
</sc-for>
</ul>
<sc-if value="{{p.hasSmall}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-size: 14px; color: {{p.sub}}; white-space: pre-line">{{p.small}}</p>
</sc-if>
<div style="display: flex; flex-direction: column; gap: 8px">
<button type="button" onClick="{{p.openCal}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border-radius: 6px; border: 0; background: {{p.btnBg}}; color: {{p.btnFg}}; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
Ver disponibilidad y reservar
</button>
<a href="{{p.wa}}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; border-radius: 6px; border: 1.5px solid {{p.outline}}; color: {{p.fg}}; text-decoration: none; font-family: Montserrat, sans-serif; font-weight: 600; font-size: 14px">Consultar por WhatsApp</a>
</div>
</article>
</sc-for>
</div>



<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px">
<sc-for list="{{current.info}}" as="inf" hint-placeholder-count="3">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 16px 18px; border-radius: 8px; background: #FEFEFE">
<span style="font-family: Montserrat, sans-serif; font-size: 15px; font-weight: 700">{{inf.label}}</span>
<span style="font-size: 15px; color: #3D3B3E; white-space: pre-line">{{inf.text}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
<sc-if value="{{current.showTras}}" hint-placeholder-val="{{true}}">
<div style="flex: 1 1 300px; min-width: 0; max-width: 560px; display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 10px; background: #222020; color: #FEFEFE; box-sizing: border-box">
<div style="display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="flex: none; width: 40px; height: 40px; border-radius: 999px; background: {{accent}}; color: #222020; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
</span>
<div style="display: flex; flex-direction: column">
<span style="font-family: 'EB Garamond', Georgia, serif; font-size: 25px; line-height: 1.1">Traslados</span>
<span style="font-size: 13px; color: #F2E4D2">Recargo según el lugar de la sesión</span>
</div>
</div>
<ul style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column">
<sc-for list="{{current.tras}}" as="t" hint-placeholder-count="6">
<li style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px dashed #3D3B3E">
<span style="font-size: 15px">{{t.place}}</span>
<sc-if value="{{t.first}}" hint-placeholder-val="{{false}}">
<span style="flex: none; padding: 4px 12px; border-radius: 999px; border: 1.5px solid {{accent}}; color: {{accent}}; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 13px">{{t.price}}</span>
</sc-if>
<sc-if value="{{t.rest}}" hint-placeholder-val="{{true}}">
<span style="flex: none; min-width: 52px; text-align: center; padding: 4px 12px; border-radius: 999px; background: {{accent}}; color: #222020; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 13px">{{t.price}}</span>
</sc-if>
</li>
</sc-for>
</ul>
<span style="font-size: 13px; color: #F2E4D2">Si la sesión requiere hospedaje en la localidad, este tiene un costo adicional.</span>
</div>
</sc-if>
<sc-if value="{{current.hasCompare}}" hint-placeholder-val="{{true}}">
<div style="flex: 2 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 12px; padding: 20px; border-radius: 10px; background: #FEFEFE; box-sizing: border-box">
<span style="font-family: 'EB Garamond', Georgia, serif; font-size: 25px; line-height: 1.1">Elige tu paquete ideal</span>
<div style="overflow-x: auto">
<div role="table" aria-label="Comparación de propuestas" style="width: max-content; min-width: 100%; display: grid; grid-template-columns: {{current.cmpCols}}; font-size: 14px">
<div role="row" style="display: contents">
<span role="columnheader" style="padding: 10px 8px; font-family: Montserrat, sans-serif; font-size: 13px; color: #3D3B3E; font-weight: 600; align-self: end">Incluye</span>
<sc-for list="{{current.cmpHead}}" as="h" hint-placeholder-count="3">
<span role="columnheader" style="padding: 10px 8px; background: {{h.bg}}; color: {{h.fg}}; font-family: Montserrat, sans-serif; text-align: center; border-radius: 6px 6px 0 0">
<span style="display: block; font-weight: 700; font-size: 13px; white-space: nowrap">{{h.name}}</span>
<span style="display: block; font-family: 'EB Garamond', Georgia, serif; font-weight: 400; font-size: 22px; line-height: 1.1">{{h.price}}</span>
</span>
</sc-for>
</div>
<sc-for list="{{current.cmpRows}}" as="r" hint-placeholder-count="8">
<div role="row" style="display: contents">
<span role="rowheader" style="padding: 9px 8px; color: #222020; background: {{r.zebra}}; border-bottom: 1px solid #EFE6DA">{{r.label}}</span>
<sc-for list="{{r.cells}}" as="c" hint-placeholder-count="3">
<span role="cell" style="text-align: center; padding: 9px 8px; font-family: Montserrat, sans-serif; font-weight: {{c.weight}}; background: {{c.bg}}; border-bottom: 1px solid #EFE6DA">{{c.v}}</span>
</sc-for>
</div>
</sc-for>
<div role="row" style="display: contents">
<span role="rowheader" style="padding: 12px 8px; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 13px; align-self: center">Reservar</span>

<span style="margin-top: 4px; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.06em; color: #3D3B3E">PASO {{xc.step}} DE 5</span>
</div>
<button type="button" onClick="{{xc.close}}" aria-label="Cerrar" style="flex: none; width: 44px; height: 44px; border-radius: 6px; border: 1.5px solid #222020; background: #FEFEFE; color: #222020; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>
<div data-keep-scroll="xc{{xc.step}}" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 22px">

<div style="display: {{xc.v1}}; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px">1. {{xc.baseTitle}}</span>
<div role="radiogroup" aria-label="Tiempo de cobertura" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{xc.bases}}" as="b" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{b.checked}}" onClick="{{b.pick}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 8px; border: 1.5px solid #222020; background: {{b.bg}}; color: {{b.fg}}; text-align: left; cursor: pointer; width: 100%">
<span style="display: flex; align-items: center; gap: 12px; min-width: 0">
<span aria-hidden="true" style="flex: none; width: 20px; height: 20px; border-radius: 50%; border: 2px solid currentColor; background: {{b.dot}}"></span>
<span style="display: flex; flex-direction: column; min-width: 0">
<span style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px">{{b.label}}</span>
<span style="font-size: 13px; color: {{b.sub}}">{{b.note}}</span>
</span>
</span>
<span style="flex: none; font-family: 'EB Garamond', Georgia, serif; font-size: 26px; line-height: 1">{{b.price}}</span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px">2. Mejora tu cobertura</span>
<sc-for list="{{xc.groups}}" as="g" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; margin-top: 10px">
<span style="font-family: 'EB Garamond', Georgia, serif; font-size: 21px; line-height: 1.2; padding-bottom: 2px; border-bottom: 2px solid {{accent}}; align-self: flex-start">{{g.title}}</span>
<sc-for list="{{g.items}}" as="x" hint-placeholder-count="4">
<sc-if value="{{x.isQty}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #EFE6DA">
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 15px">{{x.name}}</span>
<sc-if value="{{x.hasNote}}" hint-placeholder-val="{{false}}">
<span style="font-size: 12px; color: #3D3B3E">{{x.note}}</span>
</sc-if>
</div>
<div style="flex: none; display: flex; align-items: center; gap: 6px">
<button type="button" onClick="{{x.dec}}" aria-label="Quitar uno: {{x.name}}" style="width: 40px; height: 40px; border-radius: 6px; border: 1.5px solid #222020; background: #FEFEFE; color: #222020; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 20px; cursor: pointer; opacity: {{x.decOp}}">−</button>
<span aria-live="polite" style="min-width: 28px; text-align: center; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 16px">{{x.n}}</span>
<button type="button" onClick="{{x.inc}}" aria-label="Agregar uno: {{x.name}}" style="width: 40px; height: 40px; border-radius: 6px; border: 0; background: #222020; color: #FEFEFE; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 20px; cursor: pointer">+</button>
</div>
</div>
</sc-if>
<sc-if value="{{x.isChk}}" hint-placeholder-val="{{true}}">
<button type="button" role="checkbox" aria-checked="{{x.checked}}" onClick="{{x.toggle}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border: 0; border-bottom: 1px solid #EFE6DA; background: transparent; color: #222020; text-align: left; cursor: pointer; width: 100%">
<span style="display: flex; align-items: center; gap: 12px; min-width: 0">
<span aria-hidden="true" style="flex: none; width: 24px; height: 24px; border-radius: 5px; border: 2px solid #222020; background: {{x.boxBg}}; color: #222020; display: flex; align-items: center; justify-content: center">
<sc-if value="{{x.on}}" hint-placeholder-val="{{false}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
</span>
<span style="display: flex; flex-direction: column; min-width: 0">
<span style="font-family: 'Tenor Sans', Georgia, serif; font-size: 15px">{{x.name}}</span>
<sc-if value="{{x.hasInNote}}" hint-placeholder-val="{{false}}">
<span style="font-family: Montserrat, sans-serif; font-weight: 600; font-size: 12px; color: #3D3B3E">{{x.inNote}}</span>
</sc-if>
</span>
</span>
</button>
</sc-if>
</sc-for>
</div>
</sc-for>
</div>
</div>

<div style="display: {{xc.vP}}; flex-direction: column; gap: 12px">
<span style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px">¿Deseas fotos impresas?</span>
<span style="font-size: 13px; color: #3D3B3E">Tus fotos favoritas impresas en papel fotográfico profesional.</span>
<div role="group" aria-label="¿Deseas fotos impresas?" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px">
<button type="button" onClick="{{xc.prYes}}" aria-pressed="{{xc.prYesP}}" style="min-height: 50px; padding: 0 12px; border-radius: 6px; border: 1.5px solid #222020; background: {{xc.prYesBg}}; color: {{xc.prYesFg}}; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">Sí, quiero</button>
<button type="button" onClick="{{xc.prNo}}" style="min-height: 50px; padding: 0 12px; border-radius: 6px; border: 1.5px solid #222020; background: #FEFEFE; color: #222020; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px; cursor: pointer">No, gracias</button>
</div>
<sc-if value="{{xc.prOn}}" hint-placeholder-val="{{false}}">
<div data-prguide="1" style="display: flex; flex-direction: column; gap: 8px; padding: 14px; border-radius: 8px; background: #FBF7F1; border: 1px solid #EFE6DA">
<span style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 13px">Así se ven los tamaños (a escala, en pulgadas)</span>
<svg viewBox="0 0 330 157" role="img" aria-label="Comparación de tamaños de fotos impresas a escala: cartera, 4×6, 5×7, 8×10 y 11×17 pulgadas" style="width: 100%; max-width: 340px; height: auto; display: block; margin: 0 auto"><rect x="26.0" y="98.5" width="17.5" height="24.5" rx="2" fill="#F2E4D2" stroke="#222020" stroke-width="1.5"></rect><text x="34.8" y="139.0" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="11" fill="#222020">Cartera</text><text x="34.8" y="152.0" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="9.5" fill="#3D3B3E">2.5×3.5</text><rect x="63.5" y="81.0" width="28.0" height="42.0" rx="2" fill="#F2E4D2" stroke="#222020" stroke-width="1.5"></rect><text x="77.5" y="139.0" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="11" fill="#222020">4×6</text><rect x="111.5" y="74.0" width="35.0" height="49.0" rx="2" fill="#F2E4D2" stroke="#222020" stroke-width="1.5"></rect><text x="129.0" y="139.0" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="11" fill="#222020">5×7</text><rect x="166.5" y="53.0" width="56.0" height="70.0" rx="2" fill="#F2E4D2" stroke="#222020" stroke-width="1.5"></rect><text x="194.5" y="139.0" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="11" fill="#222020">8×10</text><rect x="242.5" y="4.0" width="77.0" height="119.0" rx="2" fill="#FDF1E2" stroke="#222020" stroke-width="1.5"></rect><text x="281.0" y="139.0" text-anchor="middle" font-family="Montserrat, sans-serif" font-weight="700" font-size="11" fill="#222020">11×17</text></svg>
<span style="font-size: 12.5px; line-height: 1.45; color: #3D3B3E">4×6: foto de álbum · 8×10: casi una hoja carta · 11×17: para enmarcar en la pared · Cartera: juego de 6 fotos pequeñas.</span>
</div>
<span style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 14px; margin-top: 4px">¿Cuántas quieres de cada tamaño?</span>
<sc-for list="{{xc.prints}}" as="x" hint-placeholder-count="4">
<sc-if value="{{x.isQty}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid #EFE6DA">
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-size: 15px">{{x.name}}</span>
<sc-if value="{{x.hasNote}}" hint-placeholder-val="{{false}}">
<span style="font-size: 12px; color: #3D3B3E">{{x.note}}</span>
</sc-if>
</div>
<div style="flex: none; display: flex; align-items: center; gap: 6px">
<button type="button" onClick="{{x.dec}}" aria-label="Quitar uno: {{x.name}}" style="width: 40px; height: 40px; border-radius: 6px; border: 1.5px solid #222020; background: #FEFEFE; color: #222020; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 20px; cursor: pointer; opacity: {{x.decOp}}">−</button>
<span aria-live="polite" style="min-width: 28px; text-align: center; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 16px">{{x.n}}</span>
<button type="button" onClick="{{x.inc}}" aria-label="Agregar uno: {{x.name}}" style="width: 40px; height: 40px; border-radius: 6px; border: 0; background: #222020; color: #FEFEFE; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 20px; cursor: pointer">+</button>
</div>
</div>
</sc-if>
<sc-if value="{{x.isChk}}" hint-placeholder-val="{{true}}">
<button type="button" role="checkbox" aria-checked="{{x.checked}}" onClick="{{x.toggle}}" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; border: 0; border-bottom: 1px solid #EFE6DA; background: transparent; color: #222020; text-align: left; cursor: pointer; width: 100%">
<span style="display: flex; align-items: center; gap: 12px; min-width: 0">
<span aria-hidden="true" style="flex: none; width: 24px; height: 24px; border-radius: 5px; border: 2px solid #222020; background: {{x.boxBg}}; color: #222020; display: flex; align-items: center; justify-content: center">
<sc-if value="{{x.on}}" hint-placeholder-val="{{false}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
</span>
<span style="display: flex; flex-direction: column; min-width: 0">
<span style="font-family: 'Tenor Sans', Georgia, serif; font-size: 15px">{{x.name}}</span>
<sc-if value="{{x.hasInNote}}" hint-placeholder-val="{{false}}">
<span style="font-family: Montserrat, sans-serif; font-weight: 600; font-size: 12px; color: #3D3B3E">{{x.inNote}}</span>
</sc-if>
</span>
</span>
</button>
</sc-if>
</sc-for>
</sc-if>
</div>

<div style="display: {{xc.vL}}; flex-direction: column; gap: 4px">
<span style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px">¿Dónde será el evento?</span>
<span style="font-size: 13px; color: #3D3B3E">Marca el lugar. Fuera de Las Tablas se suma el traslado.</span>
<sc-for list="{{xc.locs}}" as="l" hint-placeholder-count="7">
<button type="button" role="checkbox" aria-checked="{{l.checked}}" onClick="{{l.toggle}}" style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border: 0; border-bottom: 1px solid #EFE6DA; background: transparent; color: #222020; text-align: left; cursor: pointer; width: 100%">
<span aria-hidden="true" style="flex: none; width: 24px; height: 24px; border-radius: 5px; border: 2px solid #222020; background: {{l.boxBg}}; color: #222020; display: flex; align-items: center; justify-content: center">
<sc-if value="{{l.on}}" hint-placeholder-val="{{false}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</sc-if>
</span>
<span style="font-family: 'Tenor Sans', Georgia, serif; font-size: 15px">{{l.name}}</span>
</button>
</sc-for>
</div>

<div style="display: {{xc.vF}}; flex-direction: column; gap: 12px">
<span style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px">Elige la fecha de tu evento</span>
<div style="display: flex; justify-content: center">
<div style="display: flex; align-items: center; gap: 8px">
<button type="button" onClick="{{xc.cal.prev}}" aria-label="Mes anterior" disabled="{{xc.cal.noPrev}}" style="width: 44px; height: 44px; border-radius: 6px; border: 1.5px solid #222020; background: #FEFEFE; color: #222020; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: {{xc.cal.prevOp}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
</button>
<span style="min-width: 150px; text-align: center; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 16px">{{xc.cal.monthLabel}}</span>
<button type="button" onClick="{{xc.cal.next}}" aria-label="Mes siguiente" disabled="{{xc.cal.noNext}}" style="width: 44px; height: 44px; border-radius: 6px; border: 1.5px solid #222020; background: #FEFEFE; color: #222020; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: {{xc.cal.nextOp}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
</button>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{xc.cal.dows}}" as="d" hint-placeholder-count="7">
<span style="text-align: center; font-family: Montserrat, sans-serif; font-weight: 700; font-size: 12px; color: #3D3B3E; padding: 4px 0">{{d}}</span>
</sc-for>
<sc-for list="{{xc.cal.cells}}" as="c" hint-placeholder-count="35">
<sc-if value="{{c.blank}}" hint-placeholder-val="{{false}}">
<span aria-hidden="true"></span>
</sc-if>
<sc-if value="{{c.real}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{c.pick}}" disabled="{{c.disabled}}" aria-label="{{c.aria}}" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px; padding: 4px 0; border-radius: 6px; border: 1.5px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; cursor: {{c.cursor}}; box-sizing: border-box">
<span style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 18px; line-height: 1">{{c.n}}</span>
<span style="font-size: 10px; line-height: 1.1; white-space: nowrap; color: {{c.subFg}}">{{c.sub}}</span>
</button>
</sc-if>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: #3D3B3E">
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid #F99824; background: #FEFEFE"></span>Disponible</span>
<span style="display: inline-flex; align-items: center; gap: 6px"><span aria-hidden="true" style="width: 14px; height: 14px; border-radius: 3px; background: #3D3B3E"></span>Ocupado</span>
<span>Actualizado: {{xc.cal.updated}}</span>
</div>
<sc-if value="{{xc.hasDate}}" hint-placeholder-val="{{false}}">
<span style="padding: 10px 12px; border-radius: 6px; background: #F2E4D2; font-size: 14px">Fecha elegida: {{xc.fecha}}</span>
</sc-if>
<label style="display: flex; flex-direction: column; gap: 6px; font-family: Montserrat, sans-serif; font-size: 13px; font-weight: 600; color: #3D3B3E">Hora de inicio del evento
<input type="time" value="{{xc.time}}" onInput="{{xc.setTime}}" style="min-height: 46px; padding: 0 12px; border-radius: 6px; border: 1.5px solid #D9CDBE; background: #FEFEFE; color: #222020; font-family: 'Tenor Sans', Georgia, serif; font-size: 16px">
</label>
</div>

<div style="display: {{xc.vD}}; flex-direction: column; gap: 12px">
<span style="font-family: Montserrat, sans-serif; font-weight: 700; font-size: 15px">Tus datos</span>
<span style="font-size: 13px; color: #3D3B3E">Los necesitamos para confirmar tu reserva. Nombre, teléfono y correo son obligatorios.</span>
<label style="display: flex; flex-direction: column; gap: 6px; font-family: Montserrat, sans-serif; font-size: 13px; font-weight: 600; color: #3D3B3E">Tu nombre
<input type="text" autocomplete="name" value="{{xc.name}}" data-field="name" onInput="{{xc.setName}}" placeholder="Nombre y apellido" style="min-height: 46px; padding: 0 12px; border-radius: 6px; border: 1.5px solid {{xc.bName}}; background: #FEFEFE; color: #222020; font-family: 'Tenor Sans', Georgia, serif; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-family: Montserrat, sans-serif; font-size: 13px; font-weight: 600; color: #3D3B3E">Número de teléfono
<input type="tel" inputmode="tel" autocomplete="tel" value="{{xc.phone}}" data-field="phone" onInput="{{xc.setPhone}}" placeholder="6000-0000" style="min-height: 46px; padding: 0 12px; border-radius: 6px; border: 1.5px solid {{xc.bPhone}}; background: #FEFEFE; color: #222020; font-family: 'Tenor Sans', Georgia, serif; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-family: Montserrat, sans-serif; font-size: 13px; font-weight: 600; color: #3D3B3E">Correo electrónico
<input type="email" inputmode="email" autocomplete="email" value="{{xc.email}}" data-field="email" onInput="{{xc.setEmail}}" placeholder="tucorreo@ejemplo.com" style="min-height: 46px; padding: 0 12px; border-radius: 6px; border: 1.5px solid {{xc.bEmail}}; background: #FEFEFE; color: #222020; font-family: 'Tenor Sans', Georgia, serif; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-family: Montserrat, sans-serif; font-size: 13px; font-weight: 600; color: #3D3B3E">Tipo de evento
<input type="text" value="{{xc.type}}" onInput="{{xc.setType}}" placeholder="Cumpleaños, bautizo, boda, aniversario, empresa…" style="min-height: 46px; padding: 0 12px; border-radius: 6px; border: 1.5px solid #D9CDBE; background: #FEFEFE; color: #222020; font-family: 'Tenor Sans', Georgia, serif; font-size: 16px">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-family: Montserrat, sans-serif; font-size: 13px; font-weight: 600; color: #3D3B3E">Detalles de tu evento
<textarea rows="3" onInput="{{xc.setIdea}}" placeholder="Cantidad de invitados, momentos importantes, temática…" style="padding: 10px 12px; border-radius: 6px; border: 1.5px solid #D9CDBE; background: #FEFEFE; color: #222020; font-family: 'Tenor Sans', Georgia, serif; font-size: 16px; resize: vertical">{{xc.idea}}</textarea>
</label>
<sc-if value="{{xc.showErr}}" hint-placeholder-val="{{false}}">
<div role="alert" style="padding: 12px 14px; border-radius: 6px; border: 1.5px solid #B42318; background: #FEF3F2; color: #7A271A; font-size: 14px; line-height: 1.45">{{xc.errText}}</div>
</sc-if>
</div>
</div>

<div style="flex: none; display: flex; flex-direction: column; gap: 10px; padding: 14px 18px 16px; background: #222020; color: #FEFEFE">
<div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 12px">
<div style="display: flex; flex-direction: column; min-width: 0">
<span style="font-family: Montserrat, sans-serif; font-size: 12px; font-weight: 600; color: #F2E4D2">Total estimado</span>
<span style="font-size: 13px; color: #F2E4D2">{{xc.meta}}</span>
</div>
<span style="font-family: 'EB Garamond', Georgia, serif; font-size: 40px; line-height: 1; color: {{accent}}">{{xc.total}}</span>
</div>
<div style="display: flex; gap: 8px">
<sc-if value="{{xc.showBack}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{xc.goBack}}" style="display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: none; min-height: 52px; padding: 0 16px; border-radius: 6px; border: 1.5px solid #F2E4D2; background: transparent; color: #FEFEFE; font-family: Montserrat, sans-serif; font-weight: 600; font-size: 14px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
{{xc.backLabel}}
</button>

<script>

        var name = a.name;
        if (name.indexOf("hint-") === 0) { el.removeAttribute(name); return; }
        if (name.indexOf("on") === 0) {
          el.removeAttribute(name);
          var fn = interp(a.value, scope).raw;
          if (typeof fn === "function") el.addEventListener(name.slice(2), function (e) { fn(e); });
