name: App de NC Studio (APK)

on:
  push:
    branches: [main]
    paths: ['app-android/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Llave de firma
        env:
          KS: ${{ secrets.NC_KEYSTORE_B64 }}
          KP: ${{ secrets.NC_KEY_PASS }}
        run: |
          if [ -n "$KS" ] && [ -n "$KP" ]; then
            printf "%s" "$KS" | tr -cd "A-Za-z0-9+/=" | base64 -d > "$RUNNER_TEMP/nc.jks"
            # prueba cada palabra de lo que se pegó, por si se coló una etiqueta o un salto de línea
            OK=""
            for c in $(printf "%s" "$KP" | tr "\r\t" "  "); do
              if keytool -list -keystore "$RUNNER_TEMP/nc.jks" -storepass "$c" >/dev/null 2>&1; then OK="$c"; break; fi
            done
            if [ -z "$OK" ]; then echo "::error::La contraseña NC_KEY_PASS no coincide con la llave. Pégala de nuevo (solo la línea debajo de Secreto 1)."; exit 1; fi
            printf "%s" "$OK" > "$RUNNER_TEMP/nc.pass"
            echo "Usando la llave guardada"
          else
            # sin llave guardada: se firma con una llave temporal (para actualizar habrá que reinstalar)
            P=$(openssl rand -hex 16); echo "::add-mask::$P"
            keytool -genkeypair -keystore "$RUNNER_TEMP/nc.jks" -storetype PKCS12 -alias ncstudio -keyalg RSA -keysize 2048 -validity 10000 -storepass "$P" -keypass "$P" -dname "CN=NC Studio, C=PA"
            printf "%s" "$P" > "$RUNNER_TEMP/nc.pass"
          fi
      - name: Compilar
        env:
          NC_KEYSTORE: ${{ runner.temp }}/nc.jks
        run: |
          export NC_KEY_PASS="$(cat "$RUNNER_TEMP/nc.pass")"
          gradle -p app-android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
      - name: Publicar el APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app-android/app/build/outputs/apk/release/app-release.apk NCStudio.apk
          gh release view app >/dev/null 2>&1 || gh release create app --title "App NC Studio" --notes "Descarga NCStudio.apk desde tu teléfono e instálala."
          gh release upload app NCStudio.apk --clobber
          gh release edit app --notes "Versión 1.${{ github.run_number }} · $(date -u +%Y-%m-%d). Descarga NCStudio.apk desde tu teléfono e instálala."
