<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel galerías · NC Studio</title>
<meta name="theme-color" content="#222020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Tenor+Sans&display=swap">
<link rel="stylesheet" href="galeria.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
.cifras{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 20px}
.cifra{background:#2b2929;border:1px solid var(--gris);border-radius:12px;padding:12px 14px}
.cifra b{display:block;font-family:Montserrat,sans-serif;font-size:24px;color:var(--blanco)}
.cifra span{font-size:13px;color:#bdb3a6}
.tarjeta{background:#2b2929;border:1px solid var(--gris);border-radius:14px;padding:14px 16px;margin:0 0 12px}
.ev-adm{display:grid;grid-template-columns:96px minmax(0,1fr);gap:14px}
@media (max-width:520px){.ev-adm{grid-template-columns:56px minmax(0,1fr);gap:10px}.ev-adm .por{width:56px!important;height:56px!important}}
.ped>div{min-width:0}
.ev-adm .por{width:96px;height:96px;border-radius:10px;background-size:cover;background-position:center}
.ev-adm h3{margin:0;font-family:Montserrat,sans-serif;color:var(--blanco);font-size:17px}
.link{display:flex;gap:8px;margin:8px 0}
.link input,.sel,textarea{flex:1;min-width:0;min-height:40px;padding:0 10px;border-radius:10px;border:1.5px solid var(--gris);background:#1d1c1c;color:var(--blanco);font:inherit;font-size:14px}
textarea{width:100%;min-height:110px;padding:10px}
.mini-btn{min-height:40px;padding:0 14px;border-radius:999px;border:1.5px solid var(--gris);background:transparent;color:var(--crema);cursor:pointer;font-family:Montserrat,sans-serif;font-size:12px;font-weight:700;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.mini-btn.na{background:var(--naranja);border-color:var(--naranja);color:var(--fondo)}
.acciones{display:flex;flex-wrap:wrap;gap:8px}
.qr{background:#fff;padding:10px;border-radius:10px;display:inline-block;margin-top:8px}
.ped{display:grid;grid-template-columns:1fr auto;gap:6px 12px}
.ped .tk{font-family:Montserrat,sans-serif;font-weight:700;color:var(--naranja)}
.estado{display:inline-block;padding:3px 10px;border-radius:999px;font-family:Montserrat,sans-serif;font-size:12px;font-weight:700}
.e-esperando{background:#3a2a2a;color:#ffb4a8}.e-pagado{background:#3a3128;color:#F99824}.e-edicion{background:#22324a;color:#9cc0ff}.e-entregado{background:#1f3a2a;color:#8fe0a8}
.lista{font-family:Consolas,monospace;font-size:13px;background:#1d1c1c;border-radius:10px;padding:10px;word-break:break-all;margin:8px 0}
.msj{white-space:pre-wrap;background:#1d1c1c;border-radius:10px;padding:10px;font-size:14px;margin:8px 0}
.ok{color:#8fe0a8}.mal{color:#ffb4a8}
</style>
</head>
<body>
<header class="hd">
  <a href="news.html"><img src="logo.png" alt="NC Studio"></a>
  <nav aria-label="Panel"><a href="#" class="on">⚙️ Panel galerías</a></nav>
</header>
<main class="wrap">
  <h1>Panel de galerías</h1>
  <div class="tabs" role="tablist">
    <button class="tab on" data-t="resumen">Resumen</button>
    <button class="tab" data-t="eventos">Álbumes y links</button>
    <button class="tab" data-t="cola">Cola de edición</button>
    <button class="tab" data-t="yappy">Pagos Yappy</button>
    <button class="tab" data-t="pedidos">Pedidos</button>
    <button class="tab" data-t="capturas">Capturas</button>
    <button class="tab" data-t="reclamos">Reclamos</button>
    <button class="tab" data-t="preventas">Preventas</button>
    <button class="tab" data-t="lightroom">Lista Lightroom</button>
    <button class="tab" data-t="entregas">Entregar editadas</button>
    <button class="tab" data-t="grupales">Grupales</button>
    <button class="tab" data-t="clientes">Clientes · Carreras</button>
    <button class="tab" data-t="sesiones">Sesiones (VIP)</button>
    <button class="tab" data-t="papelera">🗑 Papelera</button>
  </div>
  <section data-p="capturas" hidden></section>
  <section data-p="reclamos" hidden></section>
  <section data-p="preventas" hidden></section>
  <section data-p="papelera" hidden></section>
  <section data-p="sesiones" hidden></section>
  <section data-p="grupales" hidden></section>
  <section data-p="yappy" hidden></section>
  <section data-p="cola" hidden></section>
  <section data-p="clientes" hidden></section>
  <section data-p="resumen"></section>
  <section data-p="eventos" hidden></section>
  <section data-p="pedidos" hidden></section>
  <section data-p="lightroom" hidden></section>
  <section data-p="entregas" hidden></section>
</main>
<script src="nc-config.js"></script>
<script>if (!(window.NC_CONFIG || {}).url) document.write('<script src="datos-prueba.js"><\/script><script src="sesiones/indice.js"><\/script>');</script>
<script src="tienda.js"></script>
<script src="nc-api.js"></script>
<script>
// en la página real: entra con el MISMO PIN de agendar.html (se recuerda en este celular)
(function arrancarPanel() {
  window.NC_API.cargarAdmin().then(panel, function (e) {
    var m = document.querySelector('main');
    m.innerHTML = '<h1>Panel de galerías</h1><p class="nota">' + ((e && e.title) || 'Sin conexión') + '. Escribe el PIN de tu página para agendar:</p>' +
      '<div class="fila"><input id="pinIn" class="buscar" type="password" inputmode="numeric" style="max-width:200px" aria-label="PIN"><button class="btn" id="pinOk">Entrar</button></div>';
    document.getElementById('pinOk').onclick = function () { try { localStorage.setItem('ncPin', document.getElementById('pinIn').value.trim()); } catch (x) {} location.reload(); };
  });
})();
function panel() {
  var T = window.NC_TIENDA, EV = (window.NC_EVENTOS || []).filter(function (e) { return !T.eventoOculto(e.id); });
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function $(x) { return '$' + Number(x || 0).toFixed(2); }
  function ev(id) { return EV.filter(function (e) { return e.id === id; })[0]; }
  function link(e) { return new URL(e.compartir || ('evento.html?e=' + encodeURIComponent(e.id)), location.href).href; }
  function copiar(txt, btn) {
    var hecho = function () { var t = btn.textContent; btn.textContent = '✓ Copiado'; setTimeout(function () { btn.textContent = t; }, 1500); };
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(hecho, function () { prompt('Copia:', txt); });
    else prompt('Copia:', txt);
  }
  function opcionesEventos(conTodos) {
    return (conTodos ? '<option value="">Todos los álbumes</option>' : '') + EV.filter(function (e) { return e.fotos.length; })
      .map(function (e) { return '<option value="' + esc(e.id) + '">' + esc(e.nombre) + '</option>'; }).join('');
  }
  var ESTADOS = { esperando: '💳 Esperando Yappy', pagado: '⏳ En la fila', edicion: '✏️ En edición', entregado: '✅ Entregado', vencido: '⌛ Vencido', pausado: '⏸ Pausado (captura)', elegir: '🎟 Por elegir' };
  function titulo(t) { return '<h3 style="font-family:Montserrat,sans-serif;color:var(--blanco);font-size:16px;margin:18px 0 8px">' + t + '</h3>'; }
  // borrar: solo Nelson (en la versión real, con su PIN); va a la papelera 30 días
  function borrarCon(tipo, id, que, luego) { if (confirm('¿Borrar ' + que + '? Va a la papelera: lo puedes recuperar durante 30 días.')) { T.borrar(tipo, id); luego(); } }

  // ---------------- resumen
  function resumen() {
    var todos = T.pedidos().filter(function (p) { return !p.borrado; }), l = todos.filter(function (p) { return T.pagado(p) && p.tipo !== 'diferencia'; }), cuenta = function (s) { return todos.filter(function (p) { return p.estado === s; }).length; };
    var total = l.reduce(function (a, p) { return a + Number(p.monto); }, 0);
    var fotos = l.reduce(function (a, p) { return a + p.fotos.length; }, 0);
    var sinMatch = T.yappys().filter(function (y) { return !y.ticket; }).length;
    var avisos = T.avisos().filter(function (a) { return !a.borrado; }).slice(-12).reverse(), pend = T.sinAbrir(), msjs = T.mensajesCliente().slice(-6).reverse();    var porEv = EV.filter(function (e) { return e.fotos.length; }).map(function (e) {
      var pe = l.filter(function (p) { return p.evento === e.id; });
      return '<tr><td>' + esc(e.nombre) + '</td><td>' + pe.length + ' pedidos</td><td>' + $(pe.reduce(function (a, p) { return a + Number(p.monto); }, 0)) + '</td></tr>';
    }).join('');
    document.querySelector('[data-p=resumen]').innerHTML =
      '<div class="cifras">' +
      '<div class="cifra"><b>' + $(total) + '</b><span>cobrado (Yappy confirmado)</span></div>' +
      '<div class="cifra"><b>' + l.length + '</b><span>pedidos pagados · ' + fotos + ' fotos</span></div>' +
      '<div class="cifra"><b>' + cuenta('esperando') + '</b><span>esperando Yappy</span></div>' +
      (sinMatch ? '<div class="cifra"><b class="mal">' + sinMatch + '</b><span>Yappys sin match (revisar)</span></div>' : '') +
      '<div class="cifra"><b>' + cuenta('pagado') + '</b><span>en cola</span></div>' +
      '<div class="cifra"><b>' + cuenta('edicion') + '</b><span>en edición</span></div>' +
      '<div class="cifra"><b>' + cuenta('entregado') + '</b><span>entregados</span></div>' +
      '<div class="cifra"><b>' + todos.filter(function (p) { return p.capturaEstado === 'revisar'; }).length + '</b><span>capturas por revisar</span></div>' +
      '<div class="cifra"><b>' + T.reclamos().filter(function (r) { return r.estado === 'pendiente'; }).length + '</b><span>reclamos por revisar</span></div></div>' +
      '<table class="tabla">' + porEv + '</table>' +
      '<div class="fila"><button class="mini-btn" id="venc">Revisar vencimientos ahora</button><span class="nota">En la versión real lo hace la tarea de Necty sola.</span></div>' +
      (pend.length ? titulo('⏳ Te faltan por escribir (en orden de turno)') + pend.map(function (x) {
        return '<div class="tarjeta ped"><div><b>' + (x.p && x.p.turno ? 'Turno ' + x.p.turno + ' · ' : '') + esc(x.p ? x.p.nombre : '') + '</b> <span class="nota">' + esc(x.p ? x.p.eventoNombre : '') + '</span></div>' +
          '<div class="acciones"><a class="mini-btn na" href="ir.html?a=' + esc(x.a.id) + '" target="_blank" rel="noopener">💬 Escribirle</a></div></div>';
      }).join('') : '') +
      titulo('Avisos que te manda Necty (uno por persona)') +
      '<p class="nota" style="margin-top:0">Solo cuando hay pago (o es gratis). «💬 Escribirle» abre su chat con el saludo ya escrito y marca que ya le escribiste.</p>' +
      (avisos.length ? avisos.map(function (a) {
        return '<div class="msj">' + esc(a.texto) + (a.saludo ? '\n' + (a.abierto ? '<span class="ok">✓ Ya abriste su chat</span> · ' : '') + '<a href="ir.html?a=' + esc(a.id) + '" target="_blank" rel="noopener">💬 Escribirle</a>' : '') + '</div>';
      }).join('') : '<p class="vacio">Todavía no hay avisos.</p>') +
      (msjs.length ? titulo('Mensajes que Necty les manda a los clientes') + msjs.map(function (m) { return '<div class="msj"><b>→ ' + esc(m.nombre) + ' (' + esc(m.tel) + ')</b>\n' + esc(m.texto) + '</div>'; }).join('') : '');
    var vb = document.getElementById('venc'); if (vb) vb.onclick = function () { var n = T.revisarVencimientos(); T.revisarPlazosSesiones(); resumen(); alert(n ? n + ' cambios por vencimientos.' : 'Nada vencido por ahora.'); };
  }

  // ---------------- sesiones: galerías privadas de la Zona VIP (nunca en News)
  function sesiones() {
    var box = document.querySelector('[data-p=sesiones]'), L = window.NC_SESIONES || [];
    var lk = function (s, t) { return new URL('sesion.html?s=' + encodeURIComponent(s.id) + '&v=' + t, location.href).href; };
    box.innerHTML = '<p class="nota" style="margin-top:0">Galerías de sesiones: <b>privadas</b>, no salen en News. Reemplazan a Pixieset: el link va en los botones «Fotos de prueba» y «Fotos finales» de la Zona VIP de la clienta, y también lo puedes mandar directo.</p>' +
      '<div class="tarjeta"><b>Cómo crear una</b><div class="lista">procesar-sesion.ps1 -Link "&lt;carpeta Drive&gt;" -Cliente "Nombre" -Sesion "Sesión de …" -Tipo pruebas -Incluidas 10 -Tel 6xxxxxxx</div>' +
      '<p class="nota" style="margin:0">Para las finales, lo mismo con <b>-Tipo finales</b>: queda en la misma galería, con el mismo link.</p></div>' +
      (L.length ? L.map(function (s, i) {
        var sel = T.selSesion(s.id), listas = T.listasSesion(s.id), otros = Object.keys(listas).filter(function (t) { return t !== s.tel && listas[t].fotos.length; });
        var notas = Object.keys(sel.notas || {}).filter(function (k) { return sel.notas[k]; });
        var plazo = T.plazoSesion(s), vencio = new Date() > plazo;
        return '<div class="tarjeta"><b>' + esc(s.cliente) + '</b> · ' + esc(s.sesion) + ' <span class="nota">· ' + esc(s.fecha) + '</span>' +
          ['pruebas', 'finales'].filter(function (t) { return s[t]; }).map(function (t) {
            return '<div class="link"><input readonly value="' + esc(lk(s, t)) + '" aria-label="Link"><button class="mini-btn" data-scop="' + i + ':' + t + '">Copiar ' + t + '</button><a class="mini-btn" target="_blank" href="' + esc(lk(s, t)) + '">Abrir</a></div>';
          }).join('') +
          '<div class="nota">' + (s.pruebas ? s.pruebas.length + ' pruebas' : 'sin pruebas') + (s.incluidas ? ' · paquete de ' + s.incluidas : '') + ' · ' + (s.finales ? s.finales.length + ' finales' : 'finales pendientes') + '</div>' +
          (s.pruebas && !sel.enviada ? '<div class="nota ' + (vencio ? 'mal' : '') + '">⏳ Plazo para elegir: hasta el ' + plazo.toLocaleDateString('es-PA') + (vencio ? ' (vencido)' : '') + ' <button class="mini-btn" data-ext="' + i + '">+2 días</button></div>' : '') +
          (sel.enviada ? '<div class="nota ok">❤ La dueña eligió ' + sel.fotos.length + ' el ' + new Date(sel.enviada).toLocaleString('es-PA') + (s.incluidas && sel.fotos.length > s.incluidas ? ' · <span class="mal">' + (sel.fotos.length - s.incluidas) + ' extra ($' + (sel.fotos.length - s.incluidas) * 10 + ')</span>' : '') + '</div>' +
            '<div class="lista">' + esc(sel.fotos.join(', ')) + '</div><button class="mini-btn na" data-slr="' + i + '">Copiar para Lightroom</button>' +
            (notas.length ? '<div class="msj"><b>📝 Notas de la clienta:</b>\n' + notas.map(function (k) { return '• ' + esc(k) + ': ' + esc(sel.notas[k]); }).join('\n') + '</div>' : '')
            : s.pruebas ? '<div class="nota">Todavía no ha enviado su selección.</div>' : '') +
          (otros.length ? '<div class="nota">💬 También dieron ♡: ' + otros.map(function (t) { return esc(listas[t].nombre || t) + ' (' + listas[t].fotos.length + ')'; }).join(' · ') + '</div>' : '') +
          (s.tel ? ' <a class="mini-btn" target="_blank" rel="noopener" href="https://wa.me/507' + esc(s.tel) + '">💬 WhatsApp</a>' : '') + '</div>';
      }).join('') : '<p class="vacio">Todavía no hay galerías de sesión.</p>');
    box.querySelectorAll('[data-scop]').forEach(function (b) { b.onclick = function () { var p = b.dataset.scop.split(':'); copiar(lk(L[p[0]], p[1]), b); }; });
    box.querySelectorAll('[data-slr]').forEach(function (b) { b.onclick = function () { copiar(T.selSesion(L[b.dataset.slr].id).fotos.join(', '), b); }; });
    box.querySelectorAll('[data-ext]').forEach(function (b) { b.onclick = function () { T.extenderSesion(L[b.dataset.ext].id, 2); sesiones(); }; });
  }

  // ---------------- capturas de "sigo a NC": la PC las lee; aquí solo las que salieron dudosas
  function capturas() {
    var box = document.querySelector('[data-p=capturas]');
    var l = T.pedidos().filter(function (p) { return p.captura && !p.borrado; });
    var rev = l.filter(function (p) { return p.capturaEstado === 'revisar'; });
    box.innerHTML = '<p class="nota" style="margin-top:0">La PC lee cada captura: si dice <b>ncstudio507</b> y <b>Siguiendo</b> se aprueba sola. Aquí te salen las dudosas. Si es falsa, Necty le cobra la diferencia y el pedido se pausa hasta que pague.</p>' +
      '<p class="nota"><span class="sim">SIMULACIÓN</span> En el prototipo todas salen "por revisar" porque la lectura la hace la PC.</p>' +
      (rev.length ? rev.map(function (p) {
        return '<div class="tarjeta ped"><div><span class="tk">' + esc(p.ticket) + '</span> ' + esc(p.nombre) + ' · ' + esc(p.eventoNombre) + ' · pagó ' + $(p.monto) + '<div class="nota">📸 ' + esc(p.captura) + '</div></div>' +
          '<div class="acciones" style="flex-direction:column;align-items:stretch"><button class="mini-btn na" data-cok="' + esc(p.ticket) + '">✓ Sí sigue</button><button class="mini-btn" data-cno="' + esc(p.ticket) + '">✗ Captura falsa</button></div></div>';
      }).join('') : '<p class="vacio">No hay capturas por revisar. 👌</p>') +
      titulo('Ya revisadas') + (l.filter(function (p) { return p.capturaEstado !== 'revisar'; }).map(function (p) {
        return '<div class="nota">' + esc(p.ticket) + ' · ' + esc(p.nombre) + ' · ' + ({ ok: '<span class="ok">✓ sigue</span>', falsa: '<span class="mal">✗ falsa: cobrando diferencia</span>', 'pagada-diferencia': '<span class="ok">pagó la diferencia</span>' }[p.capturaEstado] || '') + '</div>';
      }).join('') || '<p class="nota">—</p>');
    box.querySelectorAll('[data-cok]').forEach(function (b) { b.onclick = function () { T.revisarCaptura(b.dataset.cok, true); capturas(); }; });
    box.querySelectorAll('[data-cno]').forEach(function (b) { b.onclick = function () { if (confirm('¿Marcar la captura como falsa? Se le cobra la diferencia y el pedido se pausa.')) { T.revisarCaptura(b.dataset.cno, false); capturas(); } }; });
  }

  // ---------------- reclamos de "Esta también es mía" (paquete «todas»)
  function reclamos() {
    var box = document.querySelector('[data-p=reclamos]'), R = T.reclamos().slice().reverse();
    var src = function (evId, n) { var e = ev(evId); var f = e && e.fotos.filter(function (x) { return x.nombre === n; })[0]; return f ? f.src : ''; };
    box.innerHTML = '<p class="nota" style="margin-top:0">El que compró «todas sus fotos» puede reclamar una foto donde no lo reconocimos. Compara su rostro con la foto y decide.</p>' +
      (R.length ? R.map(function (r) {
        var p = T.pedido(r.ticket); if (!p) return '';
        return '<div class="tarjeta" style="display:grid;grid-template-columns:64px 96px minmax(0,1fr);gap:10px;align-items:center">' +
          (p.cara ? '<img src="' + esc(p.cara) + '" alt="" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--naranja)">' : '<div>👤</div>') +
          '<img src="' + esc(src(p.evento, r.foto)) + '" alt="" style="width:96px;height:96px;object-fit:cover;border-radius:10px">' +
          '<div><b>' + esc(p.nombre) + '</b> · ' + esc(r.foto) + '<div class="nota">' + esc(p.eventoNombre) + ' · turno ' + (p.turno || '—') + '</div>' +
          (r.estado === 'pendiente' ? '<div class="acciones"><button class="mini-btn na" data-rok="' + esc(r.id) + '">✓ Sí es él</button><button class="mini-btn" data-rno="' + esc(r.id) + '">✗ No es</button></div>' : '<div class="nota ' + (r.estado === 'aprobado' ? 'ok' : 'mal') + '">' + r.estado + '</div>') + '</div></div>';
      }).join('') : '<p class="vacio">No hay reclamos.</p>');
    box.querySelectorAll('[data-rok]').forEach(function (b) { b.onclick = function () { T.resolverReclamo(b.dataset.rok, true); reclamos(); }; });
    box.querySelectorAll('[data-rno]').forEach(function (b) { b.onclick = function () { T.resolverReclamo(b.dataset.rno, false); reclamos(); }; });
  }

  // ---------------- preventas con paquetes personalizados por carrera
  function preventas() {
    var box = document.querySelector('[data-p=preventas]'), L = T.preventas();
    var lk = function (pv) { return new URL('preventa.html?p=' + encodeURIComponent(pv.id), location.href).href; };
    box.innerHTML = '<p class="nota" style="margin-top:0">Vende las fotos <b>antes</b> de la carrera. Cada carrera tiene sus propios paquetes. Cuando proceses el álbum, en <b>Álbumes y links</b> tocas «Asignar preventas» y cada comprador recibe sus fotos por dorsal.</p>' +
      '<div class="tarjeta"><b>Nueva preventa</b>' +
      '<div class="link"><input id="pvNom" placeholder="Carrera, ej. 10K Las Tablas 2027"></div>' +
      '<div class="link"><input id="pvFecha" type="date" aria-label="Fecha de la carrera"><input id="pvLugar" placeholder="Lugar"><input id="pvHasta" type="date" aria-label="Se vende hasta"></div>' +
      '<div class="nota">Paquetes (nombre · fotos, 0 = todas las suyas · precio):</div><div id="pvPaq"></div>' +
      '<div class="acciones"><button class="mini-btn" id="pvMas">+ Paquete</button><button class="mini-btn na" id="pvOk">Crear preventa</button></div></div>' +
      (L.length ? L.map(function (pv, i) {
        var comp = T.pedidos().filter(function (p) { return p.preventa === pv.id && !p.borrado; });

  // ---------------- contactos de Nelson: CSV de Google Contactos (nuevo o viejo, inglés o español) o vCard
  function partirCsv(txt) {
    var filas = [], fila = [], v = '', q = false;
    for (var i = 0; i < txt.length; i++) {
      var ch = txt[i];
      if (q) { if (ch === '"') { if (txt[i + 1] === '"') { v += '"'; i++; } else q = false; } else v += ch; }
      else if (ch === '"') q = true;
      else if (ch === ',') { fila.push(v); v = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i + 1] === '\n') i++; fila.push(v); filas.push(fila); fila = []; v = ''; }
      else v += ch;
    }
    if (v || fila.length) { fila.push(v); filas.push(fila); }
    return filas;
  }
  function telefonos(s) {
    return String(s || '').split(/:::|,|;|\//).map(function (x) { return T.soloDigitos(x); }).filter(function (x) { return x.length >= 7; });
  }
  function leerCsvContactos(txt) {
    var filas = partirCsv(txt.replace(/^﻿/, '')); if (filas.length < 2) return [];
    var h = filas[0].map(function (x) { return x.trim().toLowerCase(); });
    var idx = function (re) { return h.map(function (x, i) { return re.test(x) ? i : -1; }).filter(function (i) { return i >= 0; }); };
    var nom = idx(/^(name|nombre)$/), pri = idx(/^(first name|given name|nombre de pila)$/), seg = idx(/^(middle name|additional name|segundo nombre)$/), ape = idx(/^(last name|family name|apellido|apellidos)$/);
    var tels = idx(/(phone|tel[eé]fono).*(value|valor)|^(phone|tel[eé]fono|m[oó]vil|celular)$/);
    return filas.slice(1).map(function (r) {
      var n = nom.length ? r[nom[0]] : [pri, seg, ape].map(function (c) { return c.length ? r[c[0]] : ''; }).filter(Boolean).join(' ');
      var ts = []; tels.forEach(function (i) { ts = ts.concat(telefonos(r[i])); });
      return { nombre: String(n || '').trim() || '(sin nombre)', tels: ts };
    }).filter(function (c) { return c.tels.length; });
  }
  function leerVcf(txt) {
    return txt.split(/END:VCARD/i).map(function (b) {
      var fn = (b.match(/^FN[^:]*:(.*)$/im) || [])[1] || '', ts = [];
      (b.match(/^TEL[^:]*:(.*)$/gim) || []).forEach(function (l) { ts = ts.concat(telefonos(l.replace(/^TEL[^:]*:/i, ''))); });
      return { nombre: fn.trim() || '(sin nombre)', tels: ts };
    }).filter(function (c) { return c.tels.length; });
  }

          '<div class="nota">' + c.pedidos + (c.pedidos === 1 ? ' pedido' : ' pedidos') + ' · ' + c.fotos + (c.fotos === 1 ? ' foto · ' : ' fotos · ') + $(c.gastado) + ' pagado</div>' +
          (c.contacto ? '<div class="nota ok">📇 En tus contactos como «' + esc(c.contacto.nombre) + '»</div>' : nContactos ? '<div class="nota">🆕 No está en tus contactos</div>' : '') +
          '<div class="acciones" style="margin-top:6px"><select class="sel" data-cgrupo="' + esc(c.tel) + '" style="max-width:200px;min-height:34px"><option value="">Sin grupo</option>' + Object.keys(G).map(function (g) { return '<option' + (c.grupo === g ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join('') + '</select>' +
          '<button class="mini-btn na" data-cvip="' + esc(c.tel) + '" data-cnom="' + esc(c.nombre) + '">🔐 Código Zona VIP</button>' +
          '<button class="mini-btn" data-cborrar="' + esc(c.tel) + '">Borrar cliente</button></div></div></div>';
      }).join('') : '<p class="vacio">Todavía no hay corredores.</p>') +
      titulo('👥 Grupos (clubes, equipos)') +
      '<p class="nota" style="margin-top:0">El saludo de Necty lleva la frase del grupo. Pásale a Claude el contexto de cada grupo (quiénes son, cómo hablan) y él escribe la frase base; Necty la varía.</p>' +
      Object.keys(G).map(function (g) { return '<div class="link"><input value="' + esc(g) + '" readonly style="max-width:160px"><input data-gfrase="' + esc(g) + '" value="' + esc(G[g].frase || '') + '" placeholder="Frase del grupo"><button class="mini-btn" data-gborrar="' + esc(g) + '">Quitar</button></div>'; }).join('') +
      '<div class="link"><input id="gNuevo" placeholder="Nuevo grupo, ej. Leones" style="max-width:200px"><input id="gFrase" placeholder="Frase, ej. ¡Arriba esos Leones! 🦁"><button class="mini-btn na" id="gCrear">Agregar</button></div>' +
      titulo('🙋 Posibles clientes (' + P.length + ')') +
      '<p class="nota" style="margin-top:0">Gente que abrió una galería de sesión o mandó una selfie, sin comprar todavía.</p>' +
      (P.length ? P.map(function (x) { return '<div class="tarjeta ped"><div><b>' + esc(x.nombre) + '</b> · <a href="https://wa.me/507' + esc(x.tel) + '" target="_blank">' + esc(x.tel) + '</a><div class="nota">' + esc(x.origenes.join(' · ')) + '</div></div><div class="acciones"><button class="mini-btn" data-pbor="' + esc(x.tel) + '">Borrar</button></div></div>'; }).join('') : '<p class="vacio">Todavía no hay posibles clientes.</p>');
    box.querySelectorAll('[data-cgrupo]').forEach(function (s) { s.onchange = function () { T.ponerGrupo(s.dataset.cgrupo, s.value); }; });
    box.querySelectorAll('[data-cborrar]').forEach(function (b) { b.onclick = function () { borrarCon('cliente', b.dataset.cborrar, 'los datos de este cliente (nombre, celular, correo y cara)', clientes); }; });
    // código nuevo para crear su usuario (o cambiar su contraseña) en la Zona VIP: abre tu WhatsApp con el mensaje listo
    box.querySelectorAll('[data-cvip]').forEach(function (b) {
      b.onclick = function () {
        if (!window.NC_API.real) { alert('El código de la Zona VIP solo funciona en la página real.'); return; }
        var w = window.open('', '_blank'); b.disabled = true; b.textContent = 'Creando…';
        window.NC_API.admin('codigoVip', [b.dataset.cvip, b.dataset.cnom]).then(function (r) {
          b.disabled = false; b.textContent = '🔐 Código Zona VIP';
          if (!r || !r.ok) { if (w) w.close(); alert((r && r.title) || 'No se pudo crear el código.'); return; }
          if (w) w.location.href = r.wa; else location.href = r.wa;
        }, function (e) { b.disabled = false; b.textContent = '🔐 Código Zona VIP'; if (w) w.close(); alert((e && e.title) || 'Sin conexión.'); });
      };
    });
    box.querySelectorAll('[data-gfrase]').forEach(function (i) { i.onchange = function () { T.guardarGrupo(i.dataset.gfrase, { frase: i.value.trim() }); }; });
    box.querySelectorAll('[data-gborrar]').forEach(function (b) { b.onclick = function () { T.guardarGrupo(b.dataset.gborrar, null); clientes(); }; });
    box.querySelector('#gCrear').onclick = function () { var n = box.querySelector('#gNuevo').value.trim(); if (!n) return; T.guardarGrupo(n, { frase: box.querySelector('#gFrase').value.trim() }); clientes(); };
    box.querySelectorAll('[data-pbor]').forEach(function (b) { b.onclick = function () { borrarCon('posible', b.dataset.pbor, 'este posible cliente', clientes); }; });
    box.querySelector('#clSolo').value = clSolo;
    box.querySelector('#clSolo').onchange = function () { clSolo = this.value; clientes(); };
    box.querySelector('#clImp').onchange = function () {
      var f = this.files[0]; if (!f) return;
      f.text().then(function (txt) {
        var l = /BEGIN:VCARD/i.test(txt) ? leerVcf(txt) : leerCsvContactos(txt);
        T.guardarContactos(l); clientes();
        if (!l.length) alert('No encontré contactos con teléfono en ese archivo.');
      });
    };
    var nb = box.querySelector('#clNuevos');
    if (nb) nb.onclick = function () {
      // formato que Google Contactos acepta al importar
      var filas = [['First Name', 'Last Name', 'Labels', 'E-mail 1 - Value', 'Phone 1 - Label', 'Phone 1 - Value', 'Notes']].concat(todos.filter(function (c) { return !c.contacto; }).map(function (c) {
        var p = c.nombre.split(' ');
        return [p[0], p.slice(1).join(' '), 'Corredores NC', c.correo, 'Mobile', '+507 ' + c.tel, c.eventos.join(' | ') + (c.dorsales.length ? ' · dorsal ' + c.dorsales.join(', ') : '')];
      }));
      var csv = filas.map(function (r) { return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'corredores-nuevos-para-google.csv'; a.click();
    };
    var inp = box.querySelector('#clQ');
    inp.oninput = function () { clQ = inp.value; var pos = inp.selectionStart; clientes(); var n = document.getElementById('clQ'); n.focus(); n.setSelectionRange(pos, pos); };
    box.querySelector('#clCsv').onclick = function () {
      var filas = [['Nombre', 'Celular', 'Correo', 'Grupo', 'Dorsales', 'Carreras', 'Pedidos', 'Fotos', 'Gastado', 'Último pedido', 'En mis contactos como']].concat(todos.map(function (c) {
        return [c.nombre, c.tel, c.correo || '', c.grupo || '', c.dorsales.join(' '), c.eventos.join(' | '), c.pedidos, c.fotos, c.gastado.toFixed(2), c.ultimo.slice(0, 10), c.contacto ? c.contacto.nombre : ''];
      }));
      var csv = '﻿' + filas.map(function (r) { return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(','); }).join('\r\n');
      var a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' })); a.download = 'clientes-carreras.csv'; a.click();
    };
  }

  var PINTAR = { capturas: capturas, reclamos: reclamos, preventas: preventas, papelera: papelera, sesiones: sesiones, cola: cola, yappy: yappy, resumen: resumen, eventos: eventos, pedidos: pedidos, lightroom: lightroom, entregas: entregas, grupales: grupales, clientes: clientes };
  function ir(t) {
    document.querySelectorAll('.tab').forEach(function (b) { b.classList.toggle('on', b.dataset.t === t); });
    document.querySelectorAll('[data-p]').forEach(function (s) { s.hidden = s.dataset.p !== t; });
    var on = document.querySelector('.tab.on'); if (on) on.parentNode.scrollLeft = on.offsetLeft - 16;
    PINTAR[t]();
  }
  document.querySelectorAll('.tab').forEach(function (b) { b.onclick = function () { ir(b.dataset.t); }; });
  // página real: cuando el servidor confirma un cambio, se vuelve a pintar la pestaña abierta con sus datos
  window.NC_API.envolverAdmin(function () {
    EV = (window.NC_EVENTOS || []).filter(function (e) { return !T.eventoOculto(e.id); });
    var on = document.querySelector('.tab.on'); if (on && PINTAR[on.dataset.t] && !document.querySelector('[data-p]:not([hidden]) input:focus, [data-p]:not([hidden]) textarea:focus')) PINTAR[on.dataset.t]();
  });
  ir('resumen');
}
</script>
</body>
</html>
