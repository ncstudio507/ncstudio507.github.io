<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Fotos extra · NC Studio</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
body{margin:0;background:#F2E4D2;font-family:Arial,Helvetica,sans-serif;color:#222020}
.top{background:#222020;padding:16px 20px;display:flex;align-items:center;gap:14px}
.top img{height:38px;display:block}.top span{color:#F2E4D2;font-family:Georgia,serif;font-size:18px}
.bar{height:5px;background:#F99824}
.wrap{max-width:620px;margin:0 auto;padding:24px 16px 48px;display:grid;gap:16px}
.card{background:#FEFEFE;border-radius:12px;padding:22px;display:grid;gap:14px}
h1{font:400 28px Georgia,serif;margin:0}h2{font:400 21px Georgia,serif;margin:0}
p{margin:0;line-height:1.55;font-size:16px;color:#3A3735}
.step{display:flex;align-items:center;justify-content:center;gap:18px}
.step button{width:56px;height:56px;border-radius:50%;border:2px solid #222020;background:#FEFEFE;font:bold 26px Arial;cursor:pointer;color:#222020}
.step button[disabled]{opacity:.3}
.step b{font:400 54px Georgia,serif;min-width:90px;text-align:center}
.tot{background:#222020;color:#FEFEFE;border-radius:10px;padding:16px;display:flex;justify-content:space-between;align-items:baseline}
.tot b{font:400 38px Georgia,serif;color:#F99824}
.btn{display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:8px;border:0;background:#F99824;color:#222020;font-weight:bold;font-size:17px;cursor:pointer;text-decoration:none}
.btn[disabled]{opacity:.5}.btn.w{background:#25D366;color:#fff}
textarea{font:16px Arial;padding:10px 12px;border:1.5px solid #D9CDBE;border-radius:6px;width:100%;box-sizing:border-box;min-height:70px}
.hint{font-size:14px;color:#6B6466}.err{color:#B42318;font-size:14px;min-height:1em}
.msg{background:#FEFEFE;border-radius:10px;padding:26px;font-size:17px;line-height:1.6}
.spin{width:22px;height:22px;border:3px solid #F2E4D2;border-top-color:#F99824;border-radius:50%;animation:s 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:10px}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="top"><img src="logo.png" alt="NC Studio"><span>Fotos extra</span></div>
<div class="bar"></div>
<div class="wrap" id="app"><div class="msg"><span class="spin" aria-hidden="true"></span>Cargando…</div></div>
<script>
(function () {
  var SCRIPT = "https://script.google.com/macros/s/AKfycbzaT3OjIAFX5CET8Opyjnehye_XOfdI_kwA0DxEDusXzCzesOtffZUwsvE2-IbEp4yvIQ/exec";
  var q = new URLSearchParams(location.search), id = q.get("id") || "", c = q.get("c") || "", app = document.getElementById("app");
  function $(x) { return document.getElementById(x); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (m) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[m]; }); }
  function money(x) { return "$" + (Math.round(x * 100) % 100 ? x.toFixed(2) : String(Math.round(x))); }
  function call(b) { return fetch(SCRIPT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(b) }).then(function (r) { return r.json(); }); }
  // mismo cálculo que la página de reservas
  function up5(x) { return Math.ceil(Math.round(x * 100) / 500) * 5; }
  function totalFotos(n) { var t; if (n <= 6) t = 55 + (n - 3) * 10; else if (n <= 12) t = 85 + (n - 6) * 25 / 3; else if (n <= 24) t = 135 + (n - 12) * 7.5; else t = 135 + 12 * 7.5 + (n - 24) * 3.5; return up5(t); }
  function precio(info, n) { if (!n) return 0; if (info.modo === "evento") return n * 2; if (info.modo === "personalizado") { var b = Math.max(3, info.incluidas || 3); return totalFotos(b + n) - totalFotos(b); } return n * 10; }
  function listo(info, r) {
    app.innerHTML = '<div class="card"><h1>¡Anotado, ' + esc(info.name) + '! ✨</h1><p>Pediste <b>' + r.n + ' fotos extra</b> por <b>' + esc(r.monto) + '</b>.</p>' +
      '<p>Para confirmarlas, envía <b>' + esc(r.monto) + '</b> por <b>Yappy al ' + esc(r.yappy) + '</b> y mándanos la captura por WhatsApp. En cuanto lo veamos te confirmamos por correo.</p>' +
      '<a class="btn w" href="https://wa.me/' + esc(info.whatsapp) + '?text=' + encodeURIComponent("Hola, NC Studio. Soy " + info.name + ", ya envié el Yappy de " + r.monto + " por " + r.n + " fotos extra.") + '" target="_blank" rel="noopener">Enviar la captura por WhatsApp</a>' +
      (info.galeria ? '<a class="btn" href="' + esc(info.galeria) + '" target="_blank" rel="noopener">Volver a mi galería</a>' : '') +
      '<p class="hint">Recuerda marcar con el corazón ♡ las fotos que quieres, contando las extra.</p></div>';
    window.scrollTo(0, 0);
  }
  function pinta(info) {
    if (info.pedido && info.pedido.estado === "pagado") { app.innerHTML = '<div class="msg"><b>¡Ya recibimos el pago de tus ' + info.pedido.n + ' fotos extra! ✅</b><br>Te llegan editadas con tu galería final. Si quieres más, escríbenos por WhatsApp.</div>'; return; }
    var n = info.pedido ? info.pedido.n : info.paso, paso = info.paso;
    app.innerHTML = '<div class="card"><h1>¿Te gustaron más fotos? 😍</h1><p>Tu ' + esc(info.service) + ' incluye <b>' + info.incluidas + ' fotos editadas</b>. Si te enamoraste de más, elige cuántas fotos extra quieres' + (info.evento ? ' (se agregan de 10 en 10)' : '') + ' y te decimos el precio al momento.</p>' +
      (info.pedido ? '<p class="hint">Ya tenías un pedido de ' + info.pedido.n + ' fotos extra pendiente de pago; si lo cambias, se actualiza.</p>' : '') +
      '<div class="step"><button type="button" id="menos" aria-label="Una menos">−</button><b id="n"></b><button type="button" id="mas" aria-label="Una más">+</button></div><p style="text-align:center" class="hint" id="cu"></p>' +
      '<div class="tot"><span>Total de las fotos extra</span><b id="tot"></b></div>' +
      '<label class="hint" for="nt">¿Algo que debamos saber? <small>(opcional)</small></label><textarea id="nt" placeholder="Ej.: las marqué con corazón en la galería"></textarea>' +
      '<p class="err" id="err"></p><button class="btn" id="go">Quiero estas fotos extra</button><p class="hint">Después te pedimos el pago por Yappy al ' + esc(info.yappy) + '.</p></div>';
    function up() { $("n").textContent = n; var p = precio(info, n); $("tot").textContent = money(p); $("cu").textContent = n ? "≈ " + money(p / n) + " por foto" : ""; $("menos").disabled = n <= paso; }
    $("menos").onclick = function () { n = Math.max(paso, n - paso); up(); };
    $("mas").onclick = function () { n = Math.min(info.evento ? 500 : 100, n + paso); up(); };
    up();
    $("go").onclick = function () {
      var b = this; b.disabled = true; b.innerHTML = '<span class="spin"></span>Enviando…';
      call({ action: "extras_pedir", id: id, c: c, n: n, notas: $("nt").value }).then(function (r) {
        if (!r.ok) { b.disabled = false; b.textContent = "Quiero estas fotos extra"; $("err").textContent = (r.title || "No se pudo") + ". " + (r.html || ""); return; }
        listo(info, r);
      }).catch(function () { b.disabled = false; b.textContent = "Quiero estas fotos extra"; $("err").textContent = "No pudimos conectar. Revisa tu internet."; });
    };
  }
  if (!id) { app.innerHTML = '<div class="msg">Abre esta página desde el enlace de tu correo.</div>'; return; }
  call({ action: "extras_ver", id: id, c: c }).then(function (r) {
    if (!r.ok) { app.innerHTML = '<div class="msg"><b>Ups.</b> ' + esc(r.title) + '. Escríbenos por WhatsApp.</div>'; return; }
    pinta(r);
  }).catch(function () { app.innerHTML = '<div class="msg">No pudimos cargar la página. Revisa tu internet.</div>'; });
})();
</script>
</body>
</html>
