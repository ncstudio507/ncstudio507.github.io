<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Tu contrato · NC Studio</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
body{margin:0;background:#F2E4D2;font-family:Arial,Helvetica,sans-serif;color:#222020}
.top{background:#222020;padding:16px 20px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:2}
.top img{height:38px;display:block}
.top span{color:#F2E4D2;font-family:Georgia,serif;font-size:18px}
.bar{height:5px;background:#F99824}
.paper{max-width:820px;margin:24px auto;background:#FEFEFE;border-radius:10px;padding:32px 36px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.sign{max-width:820px;margin:0 auto 40px;background:#222020;color:#FEFEFE;border-radius:10px;padding:24px 26px}
.sign label{display:flex;gap:12px;align-items:flex-start;font-size:16px;line-height:1.5;cursor:pointer}
.sign input{width:24px;height:24px;flex:none;margin-top:2px;accent-color:#F99824}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 26px;border-radius:6px;border:0;background:#F99824;color:#222020;font-weight:bold;font-size:16px;cursor:pointer;margin-top:18px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.sign label.fld{display:grid;cursor:default}.sign .fld input{width:100%;height:auto;min-height:48px;margin:0;box-sizing:border-box;accent-color:auto}
.fld{display:grid;gap:6px;margin:0 0 14px;font-size:15px;font-weight:bold;color:#F2E4D2}.fld small{font-weight:400}.fld input{font:16px Arial,Helvetica,sans-serif;padding:11px 12px;border-radius:6px;border:1.5px solid #F2E4D2;background:#FEFEFE;color:#222020}
.err{color:#FDA29B;font-size:14px;margin:10px 0 0;min-height:1em}
.note{font-size:13px;color:#F2E4D2;margin-top:12px;line-height:1.5}
.msg{max-width:820px;margin:24px auto;background:#FEFEFE;border-radius:10px;padding:26px;font-size:17px;line-height:1.6}
.msg h2{font-family:Georgia,serif;font-weight:400;font-size:28px;margin:0 0 10px}
.ok{border-left:6px solid #12B76A}
.spin{width:26px;height:26px;border:3px solid #F2E4D2;border-top-color:#F99824;border-radius:50%;animation:s 1s linear infinite;display:inline-block;vertical-align:middle;margin-right:10px}
@keyframes s{to{transform:rotate(360deg)}}
@media (max-width:640px){.paper{margin:0;border-radius:0;padding:22px 18px}.sign{border-radius:0;margin:0}.msg{margin:0;border-radius:0}}
</style>
<style id="css"></style>
</head>
<body>
<div class="top"><img src="logo.png" alt="NC Studio"><span>Tu contrato</span></div>
<div class="bar"></div>
<div id="app"><div class="msg"><span class="spin" aria-hidden="true"></span>Cargando tu contrato…</div></div>
<script>
(function () {
  var SCRIPT = "https://script.google.com/macros/s/AKfycbzaT3OjIAFX5CET8Opyjnehye_XOfdI_kwA0DxEDusXzCzesOtffZUwsvE2-IbEp4yvIQ/exec";
  var q = new URLSearchParams(location.search), id = q.get("id"), c = q.get("c");
  var app = document.getElementById("app");
  function msg(title, html, ok) { app.innerHTML = '<div class="msg' + (ok ? ' ok' : '') + '"><h2></h2><div></div></div>'; app.querySelector("h2").textContent = title; app.querySelector("h2").nextSibling.innerHTML = html; window.scrollTo(0, 0); }
  function call(body) { return fetch(SCRIPT, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) }).then(function (r) { return r.json(); }); }
  if (!id || !c) { msg("Enlace incompleto", "Abre tu contrato desde el botón del correo que te enviamos."); return; }
  call({ action: "contrato", id: id, c: c }).then(function (r) {
    if (!r.ok) { msg(r.title || "No disponible", r.html || ""); return; }
    document.getElementById("css").textContent = r.css || "";
    app.innerHTML = '<div class="paper">' + r.html + '</div>' + (r.firmado
      ? '<div class="sign"><b style="font-size:18px">✅ Este contrato ya está firmado.</b><div class="note">Te enviamos una copia en PDF a tu correo.</div></div>'
      : '<div class="sign"><label class="fld" for="fir">Nombre completo de quien firma <small>(si es otra persona, por ejemplo mamá o papá, escribe su nombre)</small><input id="fir" autocomplete="name"></label>' +
        '<label class="fld" for="ced">Cédula de quien firma<input id="ced" autocomplete="off" placeholder="Ej.: 7-123-456"></label><label><input type="checkbox" id="acepto"><span>He leído y <b>acepto los términos y condiciones</b> de este contrato. Entiendo que presionar «Enviar confirmación» equivale a mi firma.</span></label>' +
        '<button class="btn" id="enviar" disabled>Enviar confirmación</button><p class="err" id="ferr"></p><div class="note">Se registrará tu nombre, tu correo, la fecha y la hora de tu aceptación. Recibirás una copia en PDF.</div></div>');
    var chk = document.getElementById("acepto"), btn = document.getElementById("enviar");
    if (!chk) return;
    var fir = document.getElementById("fir"), ced = document.getElementById("ced");
    fir.value = r.firmante || r.nombre || "";
    if (!r.faltaCedula) { ced.parentNode.style.display = "none"; }
    chk.onchange = function () { btn.disabled = !chk.checked; };
    btn.onclick = function () {
      if (!chk.checked) return;
      var fe = document.getElementById("ferr");
      if (!fir.value.trim()) { fe.textContent = "Escribe el nombre de quien firma."; fir.focus(); return; }
      if (r.faltaCedula && ced.value.replace(/[^0-9A-Za-z]/g, "").length < 4) { fe.textContent = "Escribe la cédula de quien firma."; ced.focus(); return; }
      fe.textContent = "";
      btn.disabled = true; btn.innerHTML = '<span class="spin" aria-hidden="true"></span>Firmando…';
      call({ action: "firmar", id: id, c: c, acepto: true, firmante: fir.value.trim(), cedula: ced.value.trim() }).then(function (x) { if (!x.ok && /cédula/i.test(x.title || "")) { btn.disabled = false; btn.textContent = "Enviar confirmación"; ced.parentNode.style.display = ""; document.getElementById("ferr").textContent = x.html || x.title; return; } msg(x.title || "Listo", x.html || "", x.ok); })
        .catch(function () { btn.disabled = false; btn.textContent = "Enviar confirmación"; alert("No pudimos conectar. Revisa tu internet e inténtalo de nuevo."); });
    };
  }).catch(function () { msg("No pudimos cargar tu contrato", "Revisa tu internet y vuelve a abrir el enlace."); });
})();
</script>
</body>
</html>
