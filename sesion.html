<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Tu galería · NC Studio</title>
<meta name="theme-color" content="#222020">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Tenor+Sans&display=swap">
<link rel="stylesheet" href="galeria.css">
<style>
.cuenta.pasado b{color:#ffb4a8}
.mini .nota-ic{position:absolute;left:6px;bottom:6px;background:#22324a;color:#cfe0ff;border-radius:999px;padding:2px 7px;font-size:12px}
.mini .otros{position:absolute;left:6px;top:6px;background:#3a3128;color:#F99824;border-radius:999px;padding:2px 7px;font-size:11px;font-weight:700}
.visor .pie{flex-wrap:wrap;gap:8px}
.puerta{max-width:420px;margin:40px auto}
.imp{display:grid;grid-template-columns:56px minmax(0,1fr);gap:10px;align-items:center;margin:0 0 8px}
.imp img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.imp select,.imp input{min-height:38px;border-radius:10px;border:1.5px solid var(--gris);background:#1d1c1c;color:var(--blanco);font:inherit;font-size:14px;padding:0 8px}
</style>
</head>
<body>
<header class="hd">
  <a href="index.html" aria-label="NC Studio, página principal"><img src="logo.png" alt="NC Studio"></a>
  <nav aria-label="Menú principal"><a href="index.html">🏠 Inicio</a><a href="news.html">📰 News</a><a href="vip.html" class="on" aria-current="page">👑 Zona VIP</a></nav>
</header>
<main class="wrap" id="main">
  <p class="nota" style="margin:0"><span id="cliente"></span></p>
  <h1 id="titulo"></h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="intro"></div>
  <div class="fila"><button class="btn sec" id="compartir">↗ Compartir esta galería</button><span class="nota" id="compEst"></span></div>
  <p class="res" id="res"></p>
  <div id="grid" class="grid"></div>
  <p class="vacio" id="vacio" hidden>No hay fotos aquí.</p>
</main>

<div class="carro" id="carro" hidden>
  <div class="in">
    <div class="cuenta" id="cuenta"><div class="total" id="total"></div><div class="det" id="det"></div></div>
    <button class="btn sec" id="soloFav">Ver mis ♡</button>
    <button class="btn" id="enviar">Enviar a Nelson</button>
  </div>
</div>

<div class="visor" id="visor" hidden>
  <div class="top"><span id="vNombre"></span><span class="nota" id="vPos"></span><button class="btn sec x" id="vCerrar" aria-label="Cerrar">✕</button></div>
  <div class="marco" id="vMarco" oncontextmenu="return false">
    <img class="foto" id="vFoto" alt="">
    <div class="marca"><img src="logo.png" alt=""></div>
    <button class="nav prev" id="vPrev" aria-label="Anterior">‹</button>
    <button class="nav next" id="vNext" aria-label="Siguiente">›</button>
  </div>
  <div class="pie"><span class="nota" id="vNota"></span><button class="btn sec" id="vNotaBtn" hidden>📝 Nota</button><button class="btn" id="vAccion"></button></div>
</div>
<div class="modal" id="modal" hidden><div class="caja" id="caja"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="nc-config.js"></script>
<script>if (!(window.NC_CONFIG || {}).url) document.write('<script src="sesiones/indice.js"><\/script>');</script>
<script src="tienda.js"></script>
<script src="nc-api.js"></script>
<script>
(function () {
  var T = window.NC_TIENDA, qs = new URLSearchParams(location.search), $ = T.dinero, A = window.NC_API;
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  var main = document.getElementById('main'), sid = qs.get('s');
  var S, v, PRU, fotos, inc, R;
  var modal = document.getElementById('modal'), caja = document.getElementById('caja');
  modal.onclick = function (ev) { if (ev.target === modal && !modal.dataset.fijo) modal.hidden = true; };

  // ---------- puerta: todos dan nombre y celular una vez (son posibles clientes); el celular es el ID de su lista de ♡ ----------
  var YO = null; try { YO = JSON.parse(localStorage.getItem('nc-sesion-yo') || 'null'); } catch (e) {}
  function entrar() {
    caja.innerHTML = '<h3>Antes de ver las fotos 📸</h3><p class="nota" style="margin-top:0">Pon tu nombre y tu celular. Así guardamos tus ♡ y sabemos quién eres.</p>' +
      '<label class="campo">Nombre<input type="text" id="yNom" autocomplete="name"></label><label class="campo">Celular (WhatsApp)<input type="tel" id="yTel" placeholder="6xxx-xxxx" autocomplete="tel"></label>' +
      '<p class="nota" id="yErr" style="color:#ffb4a8"></p><div class="fila"><button class="btn" id="yOk">Ver las fotos</button></div>';
    modal.dataset.fijo = '1'; modal.hidden = false;
    document.getElementById('yOk').onclick = function () {
      var n = document.getElementById('yNom').value.trim(), t = T.soloDigitos(document.getElementById('yTel').value);
      if (!n || t.length < 7) { document.getElementById('yErr').textContent = 'Pon tu nombre y tu celular.'; return; }
      YO = { nombre: n, tel: t }; try { localStorage.setItem('nc-sesion-yo', JSON.stringify(YO)); } catch (e) {}
      delete modal.dataset.fijo; modal.hidden = true; cargar(true);
    };
  }
  if (!YO) entrar(); else cargar(false);

  // el servidor manda la galería, MI lista y los ♡ de los demás por nombre (nunca su celular)
  function cargar(recien) {
    A.gal('sesionPublica', [sid, YO.tel]).then(function (r) {
      if (!r || !r.ok) { main.innerHTML = '<h1>Galería no encontrada</h1><p class="nota">Revisa el link o entra desde tu Zona VIP.</p>'; return; }
      R = r; S = r.sesion;
      v = qs.get('v') || (S.finales ? 'finales' : 'pruebas'); if (!S[v]) v = S.finales ? 'finales' : 'pruebas';
      PRU = v === 'pruebas'; fotos = S[v] || []; inc = S.incluidas || 0;
      if (recien && !r.duena) A.gal('registrarPosible', [YO.nombre, YO.tel, 'vio la sesión de ' + S.cliente]);
      arrancar();
    }, function () { main.innerHTML = '<h1>Sin conexión</h1><p class="nota">Inténtalo otra vez.</p>'; });
  }

  function arrancar() {
    var DUENA = R.duena;
    document.title = (PRU ? 'Fotos de prueba' : 'Fotos finales') + ' · ' + S.cliente.split(' ')[0] + ' · NC Studio';
    document.body.classList.toggle('protegida', PRU);
    if (PRU) {
      document.addEventListener('contextmenu', function (ev) { if (ev.target.closest('.grid, .visor')) ev.preventDefault(); });
      document.addEventListener('dragstart', function (ev) { if (ev.target.tagName === 'IMG') ev.preventDefault(); });
    }
    document.getElementById('cliente').textContent = 'Hola, ' + YO.nombre.split(' ')[0] + ' 💛' + (DUENA ? '' : ' · galería de ' + S.cliente.split(' ')[0]);
    document.getElementById('titulo').textContent = S.sesion;
    document.getElementById('tabs').innerHTML = ['pruebas', 'finales'].filter(function (t) { return S[t]; }).map(function (t) {
      return '<a class="tab' + (t === v ? ' on' : '') + '" style="text-decoration:none" href="?s=' + encodeURIComponent(S.id) + '&v=' + t + '">' + (t === 'pruebas' ? '📸 Fotos de prueba' : '🎁 Fotos finales') + '</a>';
    }).join('');

    // ---------- mi lista de ♡ (la de la dueña es la oficial) ----------
    var L = R.mia || { fotos: [], notas: {} }; L.nombre = YO.nombre; L.notas = L.notas || {};
    var fav = L.fotos, soloFav = false, verDe = '', espera = null;
    // cada ♡ o nota se guarda en el servidor (agrupado: medio segundo después del último toque)
    function guardar() { clearTimeout(espera); espera = setTimeout(function () { A.gal('guardarMiLista', [S.id, YO.tel, YO.nombre, fav, L.notas]); }, 500); }
    function guardarYa() { clearTimeout(espera); return A.gal('guardarMiLista', [S.id, YO.tel, YO.nombre, fav, L.notas]); }
    function es(n) { return fav.indexOf(n) >= 0; }
    function alternar(n) { if (es(n)) fav.splice(fav.indexOf(n), 1); else fav.push(n); guardar(); pintarCuenta(); marcar(); }
    var OTROS = R.otros || [], listas = {}; OTROS.forEach(function (o, i) { listas['o' + i] = o; });
    function deOtros(n) { return OTROS.filter(function (o) { return o.fotos.indexOf(n) >= 0; }).map(function (o) { return o.nombre; }); }
    var otros = Object.keys(listas);
    var plazo = new Date(R.plazo), vencio = new Date() > plazo;
    function pintarCuenta() {
      var c = document.getElementById('carro'); c.hidden = !PRU || !fav.length;
      var extra = DUENA && inc ? Math.max(0, fav.length - inc) : 0;
      document.getElementById('total').textContent = DUENA && inc ? fav.length + ' de ' + inc : fav.length + (fav.length === 1 ? ' elegida' : ' elegidas');
      document.getElementById('det').textContent = DUENA && inc ? (extra ? '+' + extra + ' extra · $' + (extra * 10) : fav.length === inc ? '¡Completas tu paquete!' : 'te quedan ' + (inc - fav.length)) : 'tus sugerencias para ' + S.cliente.split(' ')[0];
      document.getElementById('cuenta').classList.toggle('pasado', !!extra);
      document.getElementById('enviar').hidden = !DUENA;
      document.body.style.paddingBottom = c.hidden ? '' : '84px';
    }

    document.getElementById('intro').innerHTML = PRU ?
      '<div class="aviso"><span>📸</span><div><b>Fotos sin editar.</b> Toca el ♡ en tus favoritas' + (DUENA && inc ? ': tu paquete incluye <b>' + inc + ' fotos</b> y cada extra cuesta $10' : '') + '. ' +
      (DUENA ? 'Cuando termines, toca <b>Enviar a Nelson</b>.' : 'Tus ♡ le llegan a ' + esc(S.cliente.split(' ')[0]) + ' como sugerencias.') + '</div></div>' +
      '<div class="promo">📝 <div><b>¿Algún pedido especial?</b> Abre la foto, toca <b>«Nota»</b> y escríbelo ahí (ej. «quítame el granito», «esta para imprimir»).</div></div>' +
      (DUENA && !L.enviada ? '<p class="nota ' + (vencio ? 'mal' : '') + '">⏳ Tienes <b>3 días</b> para elegir: hasta el <b>' + plazo.toLocaleDateString('es-PA', { weekday: 'long', day: 'numeric', month: 'long' }) + '</b>' + (vencio ? ' (ya pasó: escríbenos si necesitas más tiempo)' : '') + '.</p>' : '') +
      (DUENA && L.enviada ? '<div class="promo">✅ <div>Ya enviaste tu selección (' + fav.length + ' fotos). Si cambias algo, vuelve a enviarla.</div></div>' : '') +
      (DUENA && otros.length ? '<div class="fila"><span class="nota">💬 Favoritas de:</span>' + otros.map(function (t) { return '<button class="chip" data-de="' + esc(t) + '">' + esc(listas[t].nombre || t) + ' · ' + listas[t].fotos.length + '</button>'; }).join('') + '</div>' : '') :
      '<div class="aviso"><span>🎁</span><div><b>¡Tus fotos finales están listas!</b> Tócalas para verlas en grande y descargarlas, una por una o todas juntas. Guárdalas en dos lugares.</div></div>' +
      '<div class="fila"><button class="btn" id="zip">⬇ Descargar todas en un ZIP (' + fotos.length + ')</button><span class="nota" id="zipEst"></span></div>' +
      '<div class="fila"><button class="btn sec" id="imprimir">🖼️ Pedir impresiones o álbum</button></div>';
    document.querySelectorAll('[data-de]').forEach(function (b) { b.onclick = function () { verDe = verDe === b.dataset.de ? '' : b.dataset.de; document.querySelectorAll('[data-de]').forEach(function (x) { x.classList.toggle('on', x.dataset.de === verDe); }); pintar(); }; });

    // ---------- cuadrícula ----------
    var visibles = [];
    function pintar() {
      visibles = fotos.filter(function (f) { return (!soloFav || es(f.nombre)) && (!verDe || listas[verDe].fotos.indexOf(f.nombre) >= 0); });
      var g = document.getElementById('grid'); g.innerHTML = '';
      visibles.forEach(function (f, i) {
        var d = document.createElement('div'); d.className = 'mini'; d.dataset.n = f.nombre; d.tabIndex = 0; d.setAttribute('role', 'button'); d.setAttribute('aria-label', 'Ver ' + f.nombre);
        var o = DUENA ? deOtros(f.nombre) : [];
        d.innerHTML = '<img loading="lazy" alt="">' + (PRU ? '<button class="like" aria-label="Me gusta">♡</button>' : '<button class="like" aria-label="Descargar" style="font-size:16px">⬇</button>') +
          (PRU && L.notas[f.nombre] ? '<span class="nota-ic">📝</span>' : '') + (o.length ? '<span class="otros">♡ ' + o.length + '</span>' : '');
        d.querySelector('img').src = f.src;
        d.onclick = function () { abrir(i); };
        d.onkeydown = function (ev) { if (ev.key === 'Enter') abrir(i); };
        d.querySelector('.like').onclick = function (ev) { ev.stopPropagation(); if (PRU) alternar(f.nombre); else bajar(f); };
        g.appendChild(d);
      });
      marcar();
      document.getElementById('res').textContent = verDe ? 'Favoritas de ' + (listas[verDe].nombre || verDe) + ': ' + visibles.length : soloFav ? 'Tus favoritas: ' + visibles.length : fotos.length + (fotos.length === 1 ? ' foto' : ' fotos');
      document.getElementById('vacio').hidden = visibles.length > 0;
    }
    function marcar() {
      if (!PRU) return;
      document.querySelectorAll('.mini').forEach(function (d) { var on = es(d.dataset.n); d.classList.toggle('sel', on); d.querySelector('.like').textContent = on ? '❤' : '♡'; });
    }
    function nombreArchivo(f) { return f.src.split('/').pop(); }
    function bajar(f) { var a = document.createElement('a'); a.href = f.bajar || f.src; a.download = nombreArchivo(f); document.body.appendChild(a); a.click(); a.remove(); }

    // ---------- visor: pruebas como carreras pero 5 s a color (cada vez); finales a color ----------
    var vi = 0, reloj = null, visor = document.getElementById('visor'), marco = document.getElementById('vMarco');
    function abrir(i) {
      if (!visibles.length) return;
      vi = (i + visibles.length) % visibles.length; var f = visibles[vi];
      visor.hidden = false; document.body.style.overflow = 'hidden';
      marco.classList.remove('bn'); clearTimeout(reloj);
      document.getElementById('vFoto').src = f.src;
      document.getElementById('vNombre').textContent = f.nombre;
      document.getElementById('vPos').textContent = (vi + 1) + ' de ' + visibles.length;
      var o = DUENA ? deOtros(f.nombre) : [];
      document.getElementById('vNota').textContent = PRU ? (L.notas[f.nombre] ? '📝 ' + L.notas[f.nombre] : o.length ? '♡ de ' + o.join(', ') : 'Sin editar · vista previa') : 'Editada · lista para descargar';
      document.getElementById('vNotaBtn').hidden = !PRU;
      pintarAccion();
      if (PRU) reloj = setTimeout(function () { marco.classList.add('bn'); }, 5000);
    }
    function pintarAccion() { document.getElementById('vAccion').textContent = PRU ? (es(visibles[vi].nombre) ? '❤ Elegida' : '♡ Me gusta') : '⬇ Descargar'; }
    function cerrar() { visor.hidden = true; document.body.style.overflow = ''; clearTimeout(reloj); }
    document.getElementById('vCerrar').onclick = cerrar;
    document.getElementById('vPrev').onclick = function () { abrir(vi - 1); };
    document.getElementById('vNext').onclick = function () { abrir(vi + 1); };
    document.getElementById('vAccion').onclick = function () { var f = visibles[vi]; if (PRU) { alternar(f.nombre); pintarAccion(); } else bajar(f); };
    document.getElementById('vNotaBtn').onclick = function () {
      var f = visibles[vi], t = prompt('Nota para Nelson sobre ' + f.nombre + ' (pedido especial):', L.notas[f.nombre] || '');
      if (t === null) return; t = t.trim(); if (t) L.notas[f.nombre] = t; else delete L.notas[f.nombre];
      if (t && !es(f.nombre)) fav.push(f.nombre);
      guardar(); abrir(vi); pintar(); pintarCuenta();
    };
    document.addEventListener('keydown', function (ev) { if (visor.hidden) return; if (ev.key === 'Escape') cerrar(); if (ev.key === 'ArrowLeft') abrir(vi - 1); if (ev.key === 'ArrowRight') abrir(vi + 1); });
    var x0 = null;
    marco.addEventListener('touchstart', function (ev) { x0 = ev.touches[0].clientX; }, { passive: true });
    marco.addEventListener('touchend', function (ev) { if (x0 === null) return; var dx = ev.changedTouches[0].clientX - x0; if (Math.abs(dx) > 50) abrir(vi + (dx < 0 ? 1 : -1)); x0 = null; });

    // ---------- enviar (solo la dueña) ----------
    document.getElementById('soloFav').onclick = function () { soloFav = !soloFav; this.textContent = soloFav ? 'Ver todas' : 'Ver mis ♡'; pintar(); window.scrollTo(0, 0); };
    document.getElementById('enviar').onclick = function () {
      var extra = inc ? Math.max(0, fav.length - inc) : 0, falta = inc ? inc - fav.length : 0, nn = Object.keys(L.notas).length;
      caja.innerHTML = '<h3>¿Enviar tu selección?</h3><p class="res">' + fav.length + (fav.length === 1 ? ' foto elegida' : ' fotos elegidas') + (nn ? ' · ' + nn + ' con nota' : '') + '</p>' +
        (falta > 0 ? '<p class="nota">Todavía puedes elegir <b>' + falta + '</b> más de las incluidas en tu paquete.</p>' : '') +
        (extra ? '<p class="nota">Elegiste <b>' + extra + ' extra</b> ($' + (extra * 10) + '). Te llega el cobro por Yappy y Nelson las edita cuando llegue el pago.</p>' : '') +
        '<div class="fila"><button class="btn sec" id="mX">Seguir eligiendo</button><button class="btn" id="mOk">Enviar a Nelson</button></div>';
      modal.hidden = false;
      document.getElementById('mX').onclick = function () { modal.hidden = true; };
      document.getElementById('mOk').onclick = function () {
        this.disabled = true; this.textContent = 'Enviando…';
        guardarYa().then(function () { return A.gal('enviarMiSeleccion', [S.id, YO.tel]); }).then(function (r) {
          if (!r.ok) { caja.innerHTML = '<p class="nota">' + esc(r.title) + '</p>'; return; }
          enviada();
        });
      };
      function enviada() {
        caja.innerHTML = '<div class="ticket"><p class="nota">¡Listo, ' + esc(S.cliente.split(' ')[0]) + '!</p><div class="num">❤ ' + fav.length + '</div>' +
          '<p class="nota">Nelson ya recibió tu selección' + (Object.keys(L.notas).length ? ' y tus notas' : '') + '. Te avisamos por WhatsApp cuando estén tus fotos finales aquí mismo, en tu Zona VIP.</p>' +
          '<div class="fila" style="justify-content:center"><button class="btn" id="mFin">Listo</button></div></div>';
        document.getElementById('mFin').onclick = function () { modal.hidden = true; location.reload(); };
      }
    };

    // ---------- compartir, ZIP e impresiones ----------
    document.getElementById('compartir').onclick = function () {
      var url = location.href, est = document.getElementById('compEst');
      if (navigator.share) { navigator.share({ title: S.sesion + ' · NC Studio', text: PRU ? '¿Me ayudas a elegir mis fotos? 💛' : '¡Mira mis fotos! 📸', url: url }).catch(function () {}); return; }
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(function () { est.textContent = '✓ Link copiado'; });
    };
    var zb = document.getElementById('zip');
    if (zb) zb.onclick = function () {
      var est = document.getElementById('zipEst');
      if (!window.JSZip) { fotos.forEach(function (f, i) { setTimeout(function () { bajar(f); }, i * 600); }); return; }
      var zip = new JSZip(), n = 0; zb.disabled = true;
      Promise.all(fotos.map(function (f) { return fetch(f.src).then(function (r) { return r.blob(); }).then(function (b) { zip.file(nombreArchivo(f), b); est.textContent = 'Preparando ' + (++n) + ' de ' + fotos.length + '…'; }); }))
        .then(function () { return zip.generateAsync({ type: 'blob' }); })
        .then(function (b) { var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'NC-Studio-' + S.cliente.replace(/[^\w]+/g, '-') + '.zip'; document.body.appendChild(a); a.click(); a.remove(); est.textContent = '✓ Listo'; zb.disabled = false; })
        .catch(function () { est.textContent = 'No se pudo armar el ZIP; bájalas una por una.'; zb.disabled = false; });
    };
    var ib = document.getElementById('imprimir');
    if (ib) ib.onclick = function () {
      var opts = T.CATALOGO.map(function (c) { return '<option value="' + c.id + '">' + esc(c.nombre) + ' · ' + $(c.precio) + '</option>'; }).join('');
      caja.innerHTML = '<h3>Pedir impresiones</h3><p class="nota" style="margin-top:0">Elige foto, producto y cantidad. Pagas por Yappy y Nelson te escribe para coordinar la entrega.</p>' +
        fotos.map(function (f, i) { return '<div class="imp"><img src="' + esc(f.src) + '" alt=""><div class="fila" style="margin:0;gap:6px"><select data-prod="' + i + '"><option value="">— Nada —</option>' + opts + '</select><input data-cant="' + i + '" type="number" min="1" value="1" style="width:64px" aria-label="Cantidad"></div></div>'; }).join('') +
        '<p class="res" id="impTot">Total: $0.00</p><p class="nota" id="impErr" style="color:#ffb4a8"></p><div class="fila"><button class="btn sec" id="impX">Cancelar</button><button class="btn" id="impOk">Pedir y pagar con Yappy</button></div>';
      modal.hidden = false;
      function items() { var l = []; fotos.forEach(function (f, i) { var pr = caja.querySelector('[data-prod="' + i + '"]').value, n = Math.max(1, +caja.querySelector('[data-cant="' + i + '"]').value || 1); if (pr) l.push({ foto: f.nombre, producto: pr, cant: n }); }); return l; }
      function tot() { var t = 0; items().forEach(function (it) { t += T.CATALOGO.filter(function (c) { return c.id === it.producto; })[0].precio * it.cant; }); document.getElementById('impTot').textContent = 'Total: ' + $(t); }
      caja.querySelectorAll('select,input').forEach(function (el) { el.onchange = el.oninput = tot; });
      document.getElementById('impX').onclick = function () { modal.hidden = true; };
      document.getElementById('impOk').onclick = function () {
        var l = items(); if (!l.length) { document.getElementById('impErr').textContent = 'Elige al menos un producto.'; return; }
        A.gal('pedirImpresionPublico', [{ sesion: S.id, eventoNombre: S.sesion, nombre: YO.nombre, tel: YO.tel, items: l }]).then(function (r) {
          if (!r.ok) { document.getElementById('impErr').textContent = r.title; return; }
          var p = r.pedido;
          caja.innerHTML = '<div class="ticket"><h3 style="margin-top:0">Paga con Yappy</h3><div class="num">' + $(p.monto) + '</div>' +
            (A.real ? window.NC_API.botonYappy(p) + '<div class="fila" style="justify-content:center"><button class="btn" id="impPago">Listo</button></div></div>'
              : '<p class="nota"><span class="sim">SIMULACIÓN</span></p><div class="fila" style="justify-content:center"><button class="btn" id="impPago">Simular: llegó el Yappy</button></div></div>');
          document.getElementById('impPago').onclick = function () { if (!A.real) T.registrarYappy({ nombre: p.nombre, tel: p.tel, monto: p.monto }); caja.innerHTML = '<div class="ticket"><div class="num">🖼️</div><p class="nota">¡Listo! Nelson te escribe por WhatsApp para coordinar la entrega.</p><div class="fila" style="justify-content:center"><button class="btn" id="impFin">Listo</button></div></div>'; document.getElementById('impFin').onclick = function () { modal.hidden = true; }; };
        });
      };
    };

    pintarCuenta(); pintar();
  }
})();
</script>
</body>
</html>
