plugins { id 'com.android.application' }

android {
    namespace 'com.ncstudio.app'
    compileSdk 34
    defaultConfig {
        applicationId 'com.ncstudio.app'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(String.valueOf(project.findProperty('versionCode') ?: '1'))
        versionName '1.' + String.valueOf(project.findProperty('versionCode') ?: '1')
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('NC_KEYSTORE') ?: 'nc.jks')
            storePassword System.getenv('NC_KEY_PASS') ?: ''
            keyAlias 'ncstudio'
            keyPassword System.getenv('NC_KEY_PASS') ?: ''
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
